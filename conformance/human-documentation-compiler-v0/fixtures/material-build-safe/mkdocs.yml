site_name: Corvint Material Build Fixture
site_url: https://corvint.example.invalid/material/
docs_dir: docs
nav:
  - Home: index.md
  - Evidence: evidence.md
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.highlight
extra_css:
  - assets/extra.css
extra_javascript:
  - assets/extra.js
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn

