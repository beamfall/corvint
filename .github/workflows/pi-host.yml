# SPDX-License-Identifier: Apache-2.0
name: Pi host qualification
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'integrations/pi/**'
      - 'integrations/pi-protected/**'
      - '.github/workflows/pi-host.yml'
      - 'Makefile'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pi-host-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.2'
      - name: Install exact Pi host and build native candidates
        run: |
          npm install --prefix "$RUNNER_TEMP/pi-sdk" --no-save @earendil-works/pi-coding-agent@0.99.1
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/corvint" ./cmd/corvint
          go build -o "$RUNNER_TEMP/bin/corvint-tasks" ./cmd/corvint-tasks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/pi-sdk/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Run Pi tests with required native host prerequisites
        env:
          CORVINT_REQUIRE_PI: '1'
        run: |
          export CORVINT_PI_SDK_ROOT="$RUNNER_TEMP/pi-sdk"
          export CORVINT_PI_WORKFLOW_BIN="$RUNNER_TEMP/bin/corvint"
          npm --prefix integrations/pi test
      - name: Run portable protected Pi checks
        run: npm --prefix integrations/pi-protected test
