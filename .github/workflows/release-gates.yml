name: Release gates

# Owner-dispatched release-policy-v3 gates on hosted runners (decision 0415), on the same hosted
# platform as CI (decision 0320, AFP-V0-017). Each gate runs in its own job at the exact `sha`
# input; `full-gate` runs on ubuntu-24.04 and macos-15. `release-checklist` reads the private
# witnesses `make gate` records in its own clone, so it runs after `make gate` in each full-gate
# job. The `core-n1-replay` gate runs the CCF-V1-007 N-1 replay (runbook step 8). `linux-core`
# runs the linux/amd64 Core platform evidence natively (decision 0420 item 2).
# Every log is an artifact with its sha256 beside it; nothing here pins, commits, or publishes.
# A failed scheduled run comments on, or opens, one `nightly-triage` issue (SOP-V0-013); that job
# alone may write issues.
# `full-gate` runs `make -k gate`, so one failed step does not hide the steps after it, and the
# schedule runs every job nightly on main's head under the release label `nightly`, without the
# `release-checklist` step (decision 0435).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-hex commit to gate
        required: true
      release:
        description: Release label, used only in artifact names
        required: true

      previous_release_tag:
        description: Optional published lifecycle predecessor tag; requires previous_release_oid
        required: false
      previous_release_oid:
        description: Exact 40-hex direct tag OID (commit OID for a lightweight tag)
        required: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOPROXY: "off"
  GOSUMDB: "off"
  GOWORK: "off"
  GOFLAGS: ""
  CGO_ENABLED: "1"
  SHA: ${{ inputs.sha || github.sha }}
  RELEASE: ${{ inputs.release || 'nightly' }}
  PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
  PREVIOUS_RELEASE_OID: ${{ inputs.previous_release_oid }}

jobs:
  gate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: focused-docs
            os: ubuntu-24.04
            timeout: 30
            command: make spec-requirements-check requirement-definitions-check traceability-tests-check decision-numbers-check line-citations-check
          - gate: full-gate
            os: ubuntu-24.04
            timeout: 300
            command: make -k gate
          - gate: full-gate
            os: macos-15
            timeout: 300
            command: make -k gate
          - gate: interop-gate
            os: ubuntu-24.04
            timeout: 60
            command: make interop-gate
          # Runbook step 8's CCF-V1-007 N-1 replay against the previous published release of this
          # repository, selected as linux-core's n1 step does; with none it reports FIRST_RELEASE.
          - gate: core-n1-replay
            os: ubuntu-24.04
            timeout: 90
            command: script/core-n1-source.sh --replay
          # The companion bundle targets darwin/arm64 and smoke-runs its installed binaries.
          - gate: companion-release
            os: macos-15
            timeout: 120
            command: make companion-release-gate
    env:
      RUNNER_LABEL: ${{ matrix.os }}
    steps:
      - &check-inputs
        name: Check inputs
        run: |
          printf '%s\n' "$SHA" | grep -Eqx '[0-9a-f]{40}' || { echo "sha must be a full 40-hex commit" >&2; exit 2; }
          printf '%s\n' "$RELEASE" | grep -Eqx '[0-9A-Za-z._-]{1,64}' || { echo "release must match [0-9A-Za-z._-]{1,64}" >&2; exit 2; }
      - &checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - &verify-checkout
        name: Verify the checkout is the named commit
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - &setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: "1.27.3"
      - &provision
        name: Provision the host tools the product's fixed PATH resolves
        # Linux is ci.yml's go-product-shard step, including its checksum-pinned ripgrep release
        # binary (V1-1095, V1-1104), so a release host resolves the rg version CI tested. macOS
        # gets ripgrep from Homebrew (CI has no macOS host to match), and proves that
        # worksource.PlatformPath's darwin search path resolves go1.27.3 first.
        env:
          RG_VERSION: "15.2.0"
          RG_SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
        run: |
          sudo rm -rf /usr/local/go
          sudo ln -s "$(go env GOROOT)" /usr/local/go
          test "$(/usr/local/go/bin/go env GOVERSION)" = "go1.27.3"
          if [ "$RUNNER_OS" = Linux ]; then
            rg_name="ripgrep-$RG_VERSION-x86_64-unknown-linux-musl"
            curl -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/$rg_name.tar.gz" \
              "https://github.com/BurntSushi/ripgrep/releases/download/$RG_VERSION/$rg_name.tar.gz"
            echo "$RG_SHA256  $RUNNER_TEMP/$rg_name.tar.gz" | sha256sum --check --strict
            tar -xzf "$RUNNER_TEMP/$rg_name.tar.gz" -C "$RUNNER_TEMP" "$rg_name/rg"
            sudo install -m 0755 "$RUNNER_TEMP/$rg_name/rg" /usr/local/bin/rg
            rg_found=$(PATH=/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin command -v rg)
            test "$rg_found" = /usr/local/bin/rg
            case "$("$rg_found" --version | head -n 1)" in
              "ripgrep $RG_VERSION" | "ripgrep $RG_VERSION "*) ;;
              *) echo "::error::$rg_found is not ripgrep $RG_VERSION"; exit 1 ;;
            esac
          else
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --quiet ripgrep
            test "$(PATH=/opt/homebrew/bin:/usr/local/bin:/usr/local/go/bin:/usr/bin:/bin:/usr/sbin:/sbin go env GOVERSION)" = "go1.27.3"
          fi
          git config --global user.name corvint-ci
          git config --global user.email corvint-ci@users.noreply.github.com
          git config --global maintenance.auto false
          git config --global gc.auto 0
          git --version
      - &gate-log-helper
        name: Write the gate log helper
        # Logs live under RUNNER_TEMP: `make gate` refuses its receipt unless the checkout is clean.
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cat >"$RUNNER_TEMP/run-gate" <<'EOF'
          #!/usr/bin/env bash
          # usage: run-gate GATE COMMAND...; exits with COMMAND's code.
          gate=$1
          shift
          name="$gate-$RELEASE-$RUNNER_LABEL.log"
          log="$RUNNER_TEMP/evidence/$name"
          printf '%s sha=%s runner=%s image=%s utc=%s\n' "$gate" "$SHA" "$RUNNER_LABEL" "${ImageVersion:-unknown}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >"$log"
          printf 'run: %s/%s/actions/runs/%s/attempts/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >>"$log"
          printf 'tools: %s; %s; node %s\n' "$(go version)" "$(git --version)" "$(node --version 2>&1)" >>"$log"
          printf 'command: %s\n' "$*" >>"$log"
          "$@" 2>&1 | tee -a "$log"
          code=${PIPESTATUS[0]}
          printf '%s EXIT %s\n' "$gate" "$code" | tee -a "$log"
          (cd "$RUNNER_TEMP/evidence" && shasum -a 256 "$name" >"$name.sha256")
          exit "$code"
          EOF
          chmod 0755 "$RUNNER_TEMP/run-gate"
      - name: Run ${{ matrix.gate }}
        env:
          GATE: ${{ matrix.gate }}
          COMMAND: ${{ matrix.command }}
          # Only the N-1 replay reads this repository's published releases.
          GH_TOKEN: ${{ matrix.gate == 'core-n1-replay' && github.token || '' }}
        # COMMAND is a fixed matrix value, split on spaces into argv.
        run: |
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/run-gate" "$GATE" $COMMAND
      - name: Run release-checklist on this clone's gate witnesses
        # A nightly run is not a release candidate: the checklist fails while VERSION names a
        # tag already published, which is main's state after every release (decision 0435).
        if: ${{ !cancelled() && matrix.gate == 'full-gate' && github.event_name != 'schedule' }}
        run: |
          "$RUNNER_TEMP/run-gate" release-checklist script/release-checklist --pre-promotion
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.gate }}-${{ inputs.release || 'nightly' }}-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence/${{ matrix.gate }}-*
          if-no-files-found: error
      - if: ${{ always() && matrix.gate == 'full-gate' && github.event_name != 'schedule' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checklist-${{ inputs.release || 'nightly' }}-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence/release-checklist-*
          if-no-files-found: error

  # linux/amd64 Core platform evidence (decision 0420 item 2, PRS-V1-004, PRS-V1-006): release
  # runbook steps 5, 6 and 8 and the HLQ-V1 host tuples, run natively on this sha's own
  # linux/amd64 archive. The setup steps are the gate job's, by YAML alias.
  linux-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUNNER_LABEL: ubuntu-24.04
    steps:
      - *check-inputs
      - *checkout
      - *verify-checkout
      - *setup-go
      - *provision
      - *gate-log-helper
      - name: Produce this sha's release archives and extract linux/amd64
        id: candidate
        # Runbook steps 5 and 6. The log carries SHA256SUMS: the archive is the candidate's bytes
        # only when its row equals the one in the release's own SHA256SUMS.
        run: |
          mkdir -m 0700 "$RUNNER_TEMP/release" "$RUNNER_TEMP/current"
          # The inner sh expands the single-quoted script.
          # shellcheck disable=SC2016
          "$RUNNER_TEMP/run-gate" release-archive sh -euc '
            go run ./conformance/release-artifact-v0 archive --revision "$SHA" --output "$RUNNER_TEMP/release/core"
            cd "$RUNNER_TEMP/release/core"
            cat SHA256SUMS
            sha256sum -c SHA256SUMS
            tar -xzf corvint_linux_amd64.tar.gz -C "$RUNNER_TEMP/current" --strip-components=1
            cd "$RUNNER_TEMP/current"
            sha256sum corvint
            sha256sum -c SHA256SUMS
            ./corvint --version'
      - name: Fetch the previous release's published linux/amd64 archive (N-1)
        id: n1
        # The operator may pin a preserved nonancestor tag for SOP-V0-003 lifecycle evidence.
        # Otherwise choose the newest reachable prior tag, which must be a published release here.
        # With none, script/core-n1-source.sh reports FIRST_RELEASE and the steps below say the N-1
        # checks are not applicable; a predecessor that cannot be fetched or verified fails closed.
        # Identity stays in the archive log; the CCF-V1-007 replay is the core-n1-replay gate.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -m 0700 "$RUNNER_TEMP/n1" "$RUNNER_TEMP/previous"
          # The inner sh expands the single-quoted script.
          # shellcheck disable=SC2016
          "$RUNNER_TEMP/run-gate" n1-archive sh -euc '
            code=0
            n1=$(script/core-n1-source.sh) || code=$?
            if [ "$code" -eq 3 ]; then
              echo "::notice title=N-1::FIRST_RELEASE: no published release precedes $SHA; N-1 checks not applicable"
              echo "first_release=true" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$code" -eq 0 ] || exit "$code"
            echo "first_release=false" >>"$GITHUB_OUTPUT"
            gh release download "$n1" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/n1" --pattern corvint_linux_amd64.tar.gz --pattern SHA256SUMS
            cd "$RUNNER_TEMP/n1"
            grep -F corvint_linux_amd64.tar.gz SHA256SUMS
            sha256sum -c --ignore-missing SHA256SUMS
            tar -xzf corvint_linux_amd64.tar.gz -C "$RUNNER_TEMP/previous" --strip-components=1
            cd "$RUNNER_TEMP/previous"
            sha256sum corvint
            sha256sum -c SHA256SUMS
            ./corvint --version' sh
      - name: Install the Codex CLI and Claude Code hosts
        # The exact versions of the Core plugin rows in integrations/compatibility.json. The HLQ
        # runner gives each host a private HOME and config directory and calls the installed hook
        # commands itself, so no credential, secret or model call is used (HLQ-V1-003, HLQ-V1-004).
        run: npm install --global --no-audit --no-fund @openai/codex@0.153.2 @anthropic-ai/claude-code@2.1.267
      - name: Install lifecycle on this sha's archive (runbook step 8)
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        env:
          CORVINT_LIFECYCLE_ARCHIVE: ${{ runner.temp }}/release/core/corvint_linux_amd64.tar.gz
        run: |
          "$RUNNER_TEMP/run-gate" install-lifecycle script/check-install-lifecycle.sh
      - name: N-1 install lifecycle upgraded to this sha's corvint (runbook step 8)
        if: ${{ !cancelled() && steps.n1.outcome == 'success' }}
        env:
          CORVINT_LIFECYCLE_ARCHIVE: ${{ runner.temp }}/n1/corvint_linux_amd64.tar.gz
          CORVINT_LIFECYCLE_UPGRADE_BINARY: ${{ runner.temp }}/current/corvint
          FIRST_RELEASE: ${{ steps.n1.outputs.first_release }}
        run: |
          if [ "$FIRST_RELEASE" = true ]; then
            reason="FIRST_RELEASE: no published release precedes $SHA; the N-1 install lifecycle is not applicable"
            "$RUNNER_TEMP/run-gate" install-lifecycle-n1 echo "install-lifecycle-n1: NOT_APPLICABLE $reason"
            echo "::notice title=install-lifecycle-n1::$reason"
            echo "- install-lifecycle-n1 $reason" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$FIRST_RELEASE" = false
          "$RUNNER_TEMP/run-gate" install-lifecycle-n1 script/check-install-lifecycle.sh
      - name: Host lifecycle qualification of the three Core tuples (HLQ-V1)
        # Each raw --report is kept for conformance/host-lifecycle-v1/results/ (HLQ-V1-008). On a
        # FIRST_RELEASE run there is no --base-corvint: the upgrade case must be its only NOT_RUN
        # case, and every other case must pass.
        if: ${{ !cancelled() && steps.n1.outcome == 'success' }}
        env:
          FIRST_RELEASE: ${{ steps.n1.outputs.first_release }}
        run: |
          mkdir "$RUNNER_TEMP/host-lifecycle"
          case $FIRST_RELEASE in
            true) base=() ;;
            false) base=(--base-corvint "$RUNNER_TEMP/previous/corvint") ;;
            *) echo "::error::n1 step set no first_release output"; exit 1 ;;
          esac
          status=0
          for host in cli codex claude-code; do
            report="$RUNNER_TEMP/host-lifecycle/$host.txt"
            code=0
            "$RUNNER_TEMP/run-gate" "host-lifecycle-$host" go run ./conformance/host-lifecycle-v1 --host "$host" \
              --corvint "$RUNNER_TEMP/current/corvint" "${base[@]}" \
              --source "$GITHUB_WORKSPACE" --report "$report" || code=$?
            if [ "$FIRST_RELEASE" = true ] && [ "$code" -eq 1 ] &&
              grep -Fqx $'case\tupgrade\tNOT_RUN\tno --base-corvint supplied' "$report" &&
              grep -Fqx $'SUMMARY\tstatus=FAIL\tpassed=8\tfailed=0\tnotRun=1' "$report"; then
              reason="FIRST_RELEASE: no published release precedes $SHA; host-lifecycle-$host upgrade case is not applicable"
              echo "::notice title=host-lifecycle-$host::$reason"
              echo "- host-lifecycle-$host $reason; the other eight cases passed" >>"$GITHUB_STEP_SUMMARY"
              code=0
            fi
            [ "$code" -eq 0 ] || status=1
          done
          exit "$status"
      - name: Hostile regression matrix (runbook step 8)
        if: ${{ !cancelled() }}
        run: |
          "$RUNNER_TEMP/run-gate" hostile-regressions script/check-hostile-regressions.sh
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-core-${{ inputs.release || 'nightly' }}-ubuntu-24.04
          path: |
            ${{ runner.temp }}/evidence/
            ${{ runner.temp }}/host-lifecycle/
          if-no-files-found: error

  # SOP-V0-013 (V1-1114): a scheduled run on main that fails gets one deduplicated, visible signal,
  # a comment on the open `nightly-triage` issue or a new one, naming the failing jobs and steps
  # and the run URL. Only this job holds `issues: write`, and it runs only on a scheduled run whose
  # gate or linux-core job failed or was cancelled. It runs `.github/nightly-signal` from the
  # scheduled commit itself, with gh and jq, and checks out nothing else.
  nightly-failure-signal:
    needs: [gate, linux-core]
    if: >-
      always() && github.event_name == 'schedule' && github.ref == 'refs/heads/main' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # One signal job at a time across runs (a rerun can overlap the next nightly), so two runs
    # never both find no open issue and both open one.
    concurrency:
      group: nightly-failure-signal
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          path: trusted
          sparse-checkout: .github/nightly-signal
          persist-credentials: false
      - name: Open or update the nightly-triage issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          SHA: ${{ github.sha }}
        run: sh trusted/.github/nightly-signal/signal.sh
