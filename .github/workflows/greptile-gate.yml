name: Greptile gate

# GRG-V0-001: posts the `greptile-gate` commit status on an open pull request's head. The main
# ruleset requires it, so a PR merges only after Greptile has reviewed that head at 5/5
# confidence (or GRG-V0-002 proves the PR diff unchanged) with no unresolved Greptile thread. Greptile posts no check of its own, and
# an armed PR otherwise merges on green CI whatever its score (#100 and #117 merged at 4/5).
#
# The gate reads only GitHub metadata, never checks out or runs PR code: pull_request_target and
# issue_comment run this file from the default branch. It runs when a head is pushed (no Greptile
# review of the new head yet, so `pending` unless GRG-V0-002 carries it), on summary comment edits,
# and on workflow_dispatch with a PR number, which re-reads the state after review threads are
# resolved (resolving a thread raises no workflow event).
#
# Owner waiver (V1-5096): an approver listed in WAIVER_APPROVERS below posts a success status with
# context `greptile-gate-waiver` on the exact head (for example while Greptile is out of review
# credits), then re-runs the gate with workflow_dispatch; the gate posts `greptile-gate` success
# itself. A status any other writer posts is ignored. The ruleset should accept `greptile-gate`
# only from GitHub Actions, so a hand-posted `greptile-gate` success cannot satisfy it.
#
# A refresh first posts `pending`, so a failed read can never leave an earlier success standing.
# Reopening a resolved thread raises no workflow event, so a success can go stale before the PR
# is queued. The merge queue therefore re-evaluates: on `merge_group` the job reads the queued
# PR from the queue ref, applies the same rules to that PR's head with fresh reads, and posts the
# result on the merge-group commit, which the ruleset also requires. Every run posts on the PR head
# and on the PR's active merge-group commit, so a later Greptile edit refreshes a queued pass.
#
# Runs for one PR are serialized: the resolve job names the PR for every event (a merge_group run
# reads it from the queue ref), and the gate job's concurrency group is keyed by that number
# without cancelling a running job. An older run therefore finishes before a newer one reads, so it
# cannot post a stale pass over a newer result; a dropped pending run loses nothing because every
# run refreshes both commits.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to re-check
        required: true
  merge_group:

permissions:
  contents: read

jobs:
  resolve:
    if: >-
      github.event_name == 'pull_request_target' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.comment.user.login == 'greptile-apps[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - name: Name the pull request this run gates
        id: pr
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = merge_group ]; then
            # The queue ref names the entry's PR: refs/heads/gh-readonly-queue/<base>/pr-<N>-<base sha>.
            PR=$(printf '%s\n' "$GROUP_REF" | sed -nE 's#^refs/heads/gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]{40}$#\1#p')
          fi
          case "$PR" in ''|*[!0-9]*) echo "greptile-gate: bad PR number '$PR'"; exit 1 ;; esac
          echo "pr=$PR" >>"$GITHUB_OUTPUT"
  gate:
    needs: resolve
    # Reads the PR and its review threads, and posts the greptile-gate status (ARTIFACT-V0-008 row).
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: greptile-gate-pr-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report whether Greptile passed the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ needs.resolve.outputs.pr }}
          GROUP_SHA: ${{ github.event.merge_group.head_sha }}
          # Logins whose greptile-gate-waiver status waives the gate; must equal ci-control-plane.yml.
          WAIVER_APPROVERS: "Russe11"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = merge_group ]; then
            case "$GROUP_SHA" in *[!0-9a-f]*|'') echo "greptile-gate: bad merge-group sha '$GROUP_SHA'"; exit 1 ;; esac
            [ ${#GROUP_SHA} -eq 40 ] || { echo "greptile-gate: bad merge-group sha '$GROUP_SHA'"; exit 1; }
          fi
          case "$PR" in ''|*[!0-9]*) echo "greptile-gate: bad PR number '$PR'"; exit 1 ;; esac
          head=$(gh api "repos/$REPO/pulls/$PR" --jq 'select(.state == "open") | .head.sha')
          if [ -z "$head" ]; then
            echo "greptile-gate: PR $PR is not open; no status posted"
            exit 0
          fi
          target=$head
          short=${head:0:9}
          post() {
            for t in $target; do
              echo "greptile-gate: PR $PR head $head: $1 on $t: $2"
              gh api -X POST "repos/$REPO/statuses/$t" \
                -f state="$1" -f context=greptile-gate -f description="$2" -f target_url="$RUN_URL" >/dev/null
            done
          }
          # Every run also refreshes the PR's merge-group commit, so a lowered score cannot leave an
          # earlier queue success standing.
          if [ "$EVENT" = merge_group ]; then
            target="$target $GROUP_SHA"
          else
            # GraphQL variables are literal; gh supplies them via -f/-F.
            # shellcheck disable=SC2016
            if ! queued=$(gh api graphql \
              -f query='query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n){pullRequest(number:$p){mergeQueueEntry{headCommit{oid}}}}}' \
              -f o="${REPO%%/*}" -f n="${REPO#*/}" -F p="$PR" \
              --jq '.data.repository.pullRequest.mergeQueueEntry.headCommit.oid // ""'); then
              post pending "cannot read the merge-queue entry of PR $PR; re-run the gate"
              exit 1
            fi
            case "$queued" in
              '') ;;
              *[!0-9a-f]*) post pending "bad merge-queue commit '$queued'; re-run the gate"; exit 1 ;;
              *) [ ${#queued} -eq 40 ] || { post pending "bad merge-queue commit '$queued'; re-run the gate"; exit 1; }
                 target="$target $queued" ;;
            esac
          fi
          # V1-5096 owner waiver: the newest `greptile-gate-waiver` status on the exact head posted by
          # a login in WAIVER_APPROVERS (read from this default-branch file, so a PR cannot name
          # itself). Its state decides: success waives, anything else withdraws. Statuses posted by
          # any other writer, including a `greptile-gate` success, are ignored. The listing is newest
          # first across every context, so read every page.
          case "$WAIVER_APPROVERS" in ''|*[!A-Za-z0-9\ -]*) post pending "bad WAIVER_APPROVERS"; exit 1 ;; esac
          # GitHub logins are ASCII, as validated above.
          # shellcheck disable=SC2018,SC2019
          approvers=$(printf '%s' "$WAIVER_APPROVERS" | tr 'A-Z' 'a-z' | jq -Rc 'split(" ") | map(select(. != ""))')
          # $l belongs to jq, not the shell.
          # shellcheck disable=SC2016
          if ! waiver=$(gh api --paginate "repos/$REPO/commits/$head/statuses?per_page=100" \
            --jq '.[] | select(.context == "greptile-gate-waiver") | select((.creator.login // "" | ascii_downcase) as $l | '"$approvers"' | index($l)) | "\(.state) \(.creator.login)"' | sed -n 1p); then
            post pending "cannot read the greptile-gate-waiver statuses of $short; re-run the gate"
            exit 1
          fi
          if [ "${waiver%% *}" = success ]; then
            post success "owner waiver by ${waiver#* } on PR $PR head $short"
            exit 0
          fi
          # Withdraw any earlier success before reading: a failed read below leaves this pending.
          post pending "re-reading the Greptile review of $short"
          # The newest Greptile summary comment (Greptile edits it in place on a re-review).
          summary=$(gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq '.[] | select(.user.login == "greptile-apps[bot]") | select(.body | test("Confidence Score")) | {u: .updated_at, b: .body}' \
            | jq -rs 'sort_by(.u) | last | .b // ""')
          score=$(printf '%s\n' "$summary" | grep -oE 'Confidence Score: [0-5]/5' | head -n 1 | grep -oE '[0-5]/5' || true)
          reviewed=$(printf '%s\n' "$summary" | grep -E 'Last reviewed commit' | grep -oE '/commit/[0-9a-f]{40}' | tail -n 1 | sed 's#^/commit/##' || true)
          # shellcheck disable=SC2016
          threads=$(gh api graphql \
            -f query='query($o:String!,$n:String!,$p:Int!){repository(owner:$o,name:$n){pullRequest(number:$p){reviewThreads(first:100){totalCount nodes{isResolved comments(first:1){nodes{author{login}}}}}}}}' \
            -f o="${REPO%%/*}" -f n="${REPO#*/}" -F p="$PR" \
            --jq '.data.repository.pullRequest.reviewThreads | "\(.totalCount) \([.nodes[] | select(.isResolved | not) | select((.comments.nodes[0].author.login // "") | startswith("greptile-apps"))] | length)"')
          # GRG-V0-002: compare PR-authored diffs from GitHub metadata, never PR code. Every patch
          # byte is significant, hunk coordinates included: a base change that shifts a PR hunk,
          # or an edit moved between identical contexts, refuses the carry.
          normalized_diff() {
            local pages
            pages=$(gh api --paginate --slurp "repos/$REPO/compare/$base_ref...$1") || return 1
            printf '%s\n' "$pages" | jq -ce '
              def evidence: . == ".corvint/change.cem.json" or
                test("^\\.corvint/changes/[^/]+\\.cem\\.json$");
              if type != "array" or length != 1 then error("paginated compare") else .[0] end |
              if (.files | type) != "array" or (.files | length) >= 300 or .truncated == true
                then error("incomplete compare files") else .files end |
              map(select(((.filename | evidence) and
                ((.previous_filename // .filename) | evidence)) | not)) |
              map(if (.patch | type) != "string" or (.filename | type) != "string" or
                  (.status | type) != "string" or
                  (.previous_filename != null and (.previous_filename | type) != "string")
                then error("missing file metadata or patch") else
                  [.status, .filename, .previous_filename,
                    .patch]
                end) | sort'
          }
          carries_review() {
            local base_ref ancestry reviewed_diff head_diff
            [ "$score" = "5/5" ] && [ -n "$reviewed" ] || return 1
            base_ref=$(gh api "repos/$REPO/pulls/$PR" --jq '.base.ref // ""') || return 1
            [ -n "$base_ref" ] || return 1
            base_ref=$(printf '%s' "$base_ref" | jq -sRr @uri) || return 1
            ancestry=$(gh api "repos/$REPO/compare/$reviewed...$head" --jq '.status') || return 1
            case "$ancestry" in ahead|identical) ;; *) return 1 ;; esac
            reviewed_diff=$(normalized_diff "$reviewed") || return 1
            head_diff=$(normalized_diff "$head") || return 1
            [ "$reviewed_diff" = "$head_diff" ]
          }
          carried=false
          if [ "$reviewed" != "$head" ] && carries_review; then
            carried=true
          fi
          total=${threads% *}
          unresolved=${threads#* }
          if [ -z "$summary" ]; then
            state=pending; description="waiting for a Greptile review of $short"
          elif [ "$reviewed" != "$head" ] && [ "$carried" != true ]; then
            state=pending; description="Greptile reviewed ${reviewed:0:9}${reviewed:+, }not head $short; ask @greptileai to re-review"
          elif [ -z "$score" ]; then
            state=failure; description="cannot read the Greptile confidence score for $short"
          elif [ "$score" != "5/5" ]; then
            state=failure; description="Greptile scored $short $score; 5/5 is required"
          elif [ "$total" -gt 100 ]; then
            state=failure; description="more than 100 review threads; cannot prove none is unresolved"
          elif [ "$unresolved" -gt 0 ]; then
            state=failure; description="$unresolved unresolved Greptile thread(s) on $short"
          elif [ "$carried" = true ]; then
            state=success; description="Greptile 5/5 on ${reviewed:0:9}; head $short adds only base merges and change evidence"
          else
            state=success; description="Greptile 5/5 on $short, no unresolved Greptile thread"
          fi
          post "$state" "$description"
