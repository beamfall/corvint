                printf '%s\n' $packages | sed '/^$/d' > "$d/whole" 2> /dev/null &&
                { cat "$d/whole" && { [ -z "$slices" ] || awk '{ print $3 }' <<< "$slices"; }; } > "$d/expected" 2> /dev/null &&
                : > "$d/failed-slices" 2> /dev/null; then
                outcomes_dir="$d"
              else
                echo "::warning::shard $SHARD: forward-row outcomes are off (setup failed)"
              fi
              ;;
          esac
          run_slice() {
            CORVINT_CONFINE_ROOT="$PWD" go test -exec "$RUNNER_TEMP/test-confine" -json -p "$SHARD_TEST_P" -count=1 -race -timeout 50m "$1" "$2" "$3" < /dev/null
          }
          run_tests() {
            # AFP-V0-041: every invocation runs, whole packages first and then each slice;
            # any failed invocation fails the shard.
            # AFP-V0-541 (V1-2890): when SHARD_TEST_P is above 1 and the slices name distinct
            # packages, each slice starts in the background, writing its own stream files,
            # before the whole packages run; after them each slice's stream is replayed in slice
            # order, so the capture keeps the whole-then-slices layout and one terminal outcome
            # per invocation. Otherwise, or when the stream directory cannot be made, the slices
            # run one after another as before.
            local failed=0 streams="" n=0 ok pids=()
            if [ -n "$slices" ] && [ "$SHARD_TEST_P" != 1 ] && [ -z "$(awk '{ print $3 }' <<< "$slices" | sort | uniq -d)" ]; then
              streams=$(mktemp -d "$RUNNER_TEMP/slice-streams.XXXXXX" 2> /dev/null) || streams=""
            fi
            if [ -n "$streams" ]; then
              while read -r flag pattern pkg; do
                n=$((n + 1))
                run_slice "$flag" "$pattern" "$pkg" > "$streams/$n.json" 2> "$streams/$n.err" &
                pids+=("$!")
              done <<< "$slices"
            fi
            if [ -n "$packages" ]; then
              # shellcheck disable=SC2086
              CORVINT_CONFINE_ROOT="$PWD" go test -exec "$RUNNER_TEMP/test-confine" -json -p "$SHARD_TEST_P" -count=1 -race -timeout 50m $packages < /dev/null || {
                failed=1
                [ -z "$outcomes_dir" ] || : > "$outcomes_dir/whole-failed" || true
              }
            fi
            if [ -n "$slices" ]; then
              n=0
              while read -r flag pattern pkg; do
                n=$((n + 1))
                ok=1
                if [ -n "$streams" ]; then
                  wait "${pids[$((n - 1))]}" || ok=""
                  cat -- "$streams/$n.json" || ok=""
                  cat -- "$streams/$n.err" >&2 || true
                else
                  run_slice "$flag" "$pattern" "$pkg" || ok=""
                fi
                [ -n "$ok" ] || {
                  failed=1
                  [ -z "$outcomes_dir" ] || echo "$flag $pattern $pkg" >> "$outcomes_dir/failed-slices" || true
                }
              done <<< "$slices"
            fi
            return "$failed"
          }
          # AFP-V0-047: derive this shard's outcomes, then rerun each failed whole package and
          # failed slice once (at most 8, else SKIPPED_BOUND) and keep the rerun outcomes beside
          # the first. AFP-V0-441 (V1-2682): the rerun has its own hang detector, RERUN_MINUTES
          # for all its invocations together (exit 124 when it stops them, 137 when its kill
          # does), and records its exit status in rerun-status; only flaky.sh below may turn a
          # failed shard into a pass.
          # The rerun runs in a child bash under timeout, so no exported function or variable
          # reaches a test's environment; it exits 1 when any rerun invocation failed.
          rerun_invocations() {
            local failed=0
            while read -r -a argv; do
              CORVINT_CONFINE_ROOT="$PWD" go test -exec "$RUNNER_TEMP/test-confine" -json -p "$SHARD_TEST_P" -count=1 -race -timeout 50m "${argv[@]}" < /dev/null || failed=1
            done < "$1"
            return "$failed"
          }
          forward_outcomes() {
            OUTCOMES_TREE=$(git rev-parse --verify -q "$TESTED_MERGE^{tree}" || true)
            export OUTCOMES_TREE
            rm -f -- "$outcomes_dir/rerun-status"
            sh .github/forward-rows/outcomes.sh first "$outcomes_dir" "$1" "$capture" || return 1
            [ -s "$outcomes_dir/rerun-lines" ] || return 0
            echo "AFP-V0-441: rerunning $(wc -l < "$outcomes_dir/rerun-lines") failed invocation(s) once, within $RERUN_MINUTES min"
            local rerun_status=0
            # shellcheck disable=SC2016 # $1 expands in the child bash
            timeout -k 1m "${RERUN_MINUTES}m" bash -c "$(declare -f rerun_invocations)"'; rerun_invocations "$1"' rerun "$outcomes_dir/rerun-lines" \
              > "$outcomes_dir/rerun.stream" || rerun_status=$?
            echo "$rerun_status" > "$outcomes_dir/rerun-status"
            sh .github/forward-rows/outcomes.sh rerun "$outcomes_dir" "$outcomes_dir/rerun.stream"
          }
          # AFP-V0-040: best-effort capture of the JSON stream for the advisory cost-drift
          # report. Only go test's own status decides this step: a capture file that cannot
          # be created runs the tests uncaptured, and tee's status is never consulted.
          capture="$RUNNER_TEMP/shard-costs/shard-$SHARD.json"
          if mkdir -p "$RUNNER_TEMP/shard-costs" 2> /dev/null && : 2> /dev/null > "$capture"; then
            set +e
            run_tests | tee "$capture"
            status=${PIPESTATUS[0]}
            set -e
            flaky=""
            if [ -n "$outcomes_dir" ]; then
              outcomes_ok=1
              forward_outcomes "$status" || { outcomes_ok=""; echo "::warning::shard $SHARD: forward-row outcomes incomplete"; }
              # AFP-V0-441 (V1-2682): a failed shard passes only when its outcomes are complete,
              # flaky.sh finds that every failed invocation passed its one rerun (it then labels
              # the shard FLAKY in the job summary and an annotation and writes flaky.json), and
              # the flaky output that makes the next step retain flaky.json was written. A second
              # failure, a stopped or incomplete rerun, or a bounded (SKIPPED_BOUND) rerun keeps
              # the first status.
              if [ "$status" != 0 ] && [ -n "$outcomes_ok" ] && sh .github/forward-rows/flaky.sh "$outcomes_dir" "$capture" &&
                echo "flaky=1" >> "$GITHUB_OUTPUT"; then
                flaky=1
                status=0
              fi
            fi
            # AFP-V0-531 (V1-2689): a shard that still fails names a typed reason per failed
            # package and its FAIL lines in the job summary; advisory, it never changes the status.
            [ "$status" = 0 ] || sh .github/forward-rows/failed.sh "$capture" "$status" || true
            [ "$status" = 0 ] || exit "$status"
            [ -n "$flaky" ] || [ -n "$narrowed" ] || echo "costs=1" >> "$GITHUB_OUTPUT" || true
          else
            echo "::notice::shard $SHARD: package outcomes not captured; the cost-drift report will abstain"
            run_tests
          fi
          # AFP-V0-024/170: a shard names no tested tree; the ci-tested-tree-record job does,
          # after every shard passed in full. A narrowed shard (AFP-V0-099) stops that job.
          if [ -n "$narrowed" ]; then
            echo "AFP-V0-098: selected packages passed; the full suite runs in the merge queue"
          fi
      - name: Retain the shard coverage marker (AFP-V0-591)
        # go-product reads every shard's marker. It is not continue-on-error and overwrites the
        # marker of an earlier attempt, so a shard that passed in its latest attempt always left
        # the marker of that attempt; one that cannot upload it fails.
        # AFP-V0-732: a merge-queue entry's shards leave markers too.
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && steps.tests.outcome != 'skipped'
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-coverage-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ci-coverage/coverage.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Retain package outcomes for the advisory cost-drift report
        # AFP-V0-040: only a complete full shard whose tests passed keeps its outcomes, and
        # AFP-V0-422: only on the hosted image, because self-hosted timings are not cloud timings.
        if: steps.tests.outputs.costs == '1' && runner.environment != 'self-hosted'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-shard-costs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shard-costs/shard-${{ strategy.job-index }}.json
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true
      - name: Mark a self-hosted shard for the advisory cost-drift report (AFP-V0-422)
        # In place of the stream a hosted shard would keep, so ci-shard-cost-drift abstains with
        # the runner as its reason instead of comparing box timings with the cloud table.
        id: costs-marker
        if: steps.tests.outputs.costs == '1' && runner.environment == 'self-hosted'
        continue-on-error: true
        timeout-minutes: 1
        env:
          SHARD: ${{ strategy.job-index }}
        run: |
          mkdir -p "$RUNNER_TEMP/shard-runner"
          printf '%s\n' "$RUNNER_ENVIRONMENT" > "$RUNNER_TEMP/shard-runner/shard-$SHARD.self-hosted"
          # AFP-V0-460 (V1-1753): the shard's summed package time, for the advisory balance report.
          if s=$(jq -s 'map(select(.Test == null and (.Action == "pass" or .Action == "fail" or .Action == "skip") and (.Elapsed | type) == "number") | .Elapsed) | add // 0 | floor' "$RUNNER_TEMP/shard-costs/shard-$SHARD.json"); then
            printf 'packageSeconds=%s\n' "$s" >> "$RUNNER_TEMP/shard-runner/shard-$SHARD.self-hosted"
          fi
      - name: Retain the self-hosted marker for the advisory cost-drift report (AFP-V0-422)
        if: steps.costs-marker.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-shard-costs-runner-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shard-runner/shard-${{ strategy.job-index }}.self-hosted
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true
      - name: Retain the FLAKY record (AFP-V0-441)
        # V1-2682: a shard that failed its first attempt and passed only its one rerun keeps the
        # corvint-ci-flaky/0 record naming the first attempt's failed packages and tests. The
        # FLAKY pass depends on it: a failed or empty upload fails the shard.
        if: always() && steps.tests.outputs.flaky == '1'
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-flaky-${{ github.event_name }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/forward-outcomes/flaky.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Retain package outcomes for the forward rows
        # AFP-V0-047: the shard's corvint-ci-outcomes/0 document, also after a failed or
        # interrupted shard; the ci-control-plane forward-rows job reads it.
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-outcomes-${{ github.event_name }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/forward-outcomes/outcomes.json
          if-no-files-found: ignore
          overwrite: true
      - name: Classify a failed main shard's packages for the main-miss link (AFP-V0-983)
        # V1-3750: a failed full push shard of main keeps failed.jq's classification of its
        # capture, so the ci-control-plane main-miss job can link the failed packages back to the
        # narrowed pull requests that skipped them. It never changes the shard's status.
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          mkdir -p "$RUNNER_TEMP/main-failed"
          jq -R -s -c -f .github/forward-rows/failed.jq "$RUNNER_TEMP/shard-costs/shard-${{ strategy.job-index }}.json" \
            > "$RUNNER_TEMP/main-failed/failed.json"
      - name: Retain a failed main shard's packages (AFP-V0-983)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-failed-push-${{ strategy.job-index }}
          path: ${{ runner.temp }}/main-failed/failed.json
          if-no-files-found: ignore
          overwrite: true
      - name: Refresh the host-local Go build seed (self-hosted merge-queue shards on main, AFP-V0-428)
        # AFP-V0-428: only a merge-queue entry on main whose race invocation passed refreshes this
        # runner's seed. The job cache, its test results expired, is copied beside the seed and
        # swapped in by an atomic rename of the seed link, so a reader never sees a partial seed;
        # the replaced copy and any interrupted refresh's copy are removed. A cache above SEED_CAP_KIB removes the seed instead, so the
        # next shard on this runner starts cold. A refusal or failure never fails the shard.
        if: runner.environment == 'self-hosted' && github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main' && steps.tests.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: source
        env:
          # AFP-V0-428: the explicit cap on one seed (8 GiB); the root holds one seed per runner.
          SEED_CAP_KIB: "8388608"
          SEED_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
        run: |
          test "$(go env GOCACHE)" = "$RUNNER_TEMP/go-build"
          case "$RUNNER_NAME" in
            '' | *[!A-Za-z0-9_-]*)
              echo "::notice::AFP-V0-428: runner name '$RUNNER_NAME' is not a plain seed name; not refreshing"
              exit 0
              ;;
          esac
          root=$CORVINT_BOX_GOCACHE_ROOT
          seed="$root/go-build-race-$RUNNER_NAME"
          umask 077
          mkdir -p -- "$root"
          if [ -L "$root" ] || [ ! -O "$root" ] || [ -n "$(find "$root" -maxdepth 0 -perm /022)" ]; then
            echo "::warning::AFP-V0-428: seed root $root is a link, foreign or group/world-writable; not refreshing"
            exit 0
          fi
          go clean -testcache
          size=$(du -sk -- "$GOCACHE" | cut -f1)
          if [ "$size" -gt "$SEED_CAP_KIB" ]; then
            rm -rf -- "$seed" "$seed".*
            echo "::notice::AFP-V0-428: the job cache is $size KiB, above the $SEED_CAP_KIB KiB cap; seed removed, the next shard on $RUNNER_NAME starts cold"
            exit 0
          fi
          next="$seed.$SEED_TAG"
          # Every generation but the live one, including an interrupted refresh's copy, goes first,
          # so failed refreshes never accumulate; this copy is removed if the step fails.
          live=$(readlink -e -- "$seed" || true)
          for old in "$seed".*; do
            [ "$old" = "$live" ] || rm -rf -- "$old"
          done
          trap 'rm -rf -- "$next.tmp"' EXIT
          cp -a -- "$GOCACHE" "$next.tmp"
          mv -T -- "$next.tmp" "$next"
          ln -s -- "${next##*/}" "$seed.link"
          mv -Tf -- "$seed.link" "$seed"
          for old in "$seed".*; do
            [ "$old" = "$next" ] || rm -rf -- "$old"
          done
          echo "AFP-V0-428: $seed now holds $size KiB from run $SEED_TAG"
      - name: Expire cached test results before saving the build cache
        # Only a main push whose full race invocation passed writes the cache. A REUSE or DOCS
        # push (AFP-V0-024, including a push that reuses its queue run) compiles nothing, skips
        # the tests step, and saving it would make the newest entry an empty one.
        id: testcache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        working-directory: source
        run: |
          test "$(go env GOCACHE)" = "$HOME/.cache/go-build"
          go clean -testcache
      - name: Save the trusted Go build cache (main pushes only)
        if: steps.testcache.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gocache.outputs.cache-primary-key }}
      - name: Fail loudly on an unreachable or unbuildable pin (CIN-V0-002, V1-3309)
        # The pin steps above stay continue-on-error so the full suite still runs, but a pin that
        # cannot be fetched or built leaves every forward row of this run INCOMPLETE and narrowing
        # dead; the shard fails here, after every other step, and names the pin.
        if: always() && (steps.pin-tool-capture.outcome == 'failure' || steps.pin-tool-build.outcome == 'failure' || steps.pin-shadow-capture.outcome == 'failure' || steps.pin-shadow-build.outcome == 'failure')
        timeout-minutes: 1
        env:
          TOOL_CAPTURE: ${{ steps.pin-tool-capture.outcome }}
          TOOL_BUILD: ${{ steps.pin-tool-build.outcome }}
          SHADOW_CAPTURE: ${{ steps.pin-shadow-capture.outcome }}
          SHADOW_BUILD: ${{ steps.pin-shadow-build.outcome }}
        run: |
          for s in "CORVINT_PR_TOOL_SOURCE $CORVINT_PR_TOOL_SOURCE fetch $TOOL_CAPTURE" "CORVINT_PR_TOOL_SOURCE $CORVINT_PR_TOOL_SOURCE build $TOOL_BUILD" \
            "CORVINT_TEST_SHADOW_SOURCE $CORVINT_TEST_SHADOW_SOURCE fetch $SHADOW_CAPTURE" "CORVINT_TEST_SHADOW_SOURCE $CORVINT_TEST_SHADOW_SOURCE build $SHADOW_BUILD"; do
            set -- $s
            if [ "$4" = failure ]; then
              echo "::error title=CI pin unreachable (CIN-V0-002)::$1 $2 failed to $3; every forward row of this run is INCOMPLETE until it is repinned"
              echo "CIN-V0-002: $1 $2 failed to $3" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit 1

  ci-tested-tree-record:
    # AFP-V0-170 (V1-2271): the only evidence the AFP-V0-024/046 reuse decision accepts. In a
    # pull-request or merge-queue run, after every go-product shard passed with its complete
    # package set (not DOCS, not REUSE, and no shard narrowed: the verdict is not MET, or every
    # shard's own full<index> output says FULL, V1-3051), it
    # prints the tested tree, the tested commit, its second parent and the shard count as one
    # fixed line to this job's own log. It runs no repository code (checkout, git and printf
    # only) and persists no credentials, so no test, build step or fork pull request in another
    # job can write that log. Only ci.yml, which the ci-control-plane admin review gates and
    # which is part of the tree a reusing commit must equal, changes what it prints. Any
    # mismatch prints no record, and the reusing run runs FULL; this job never fails CI.
    needs: [docs-plan, narrowing-verdict, go-product-shard]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.go-product-shard.result == 'success' && (needs.narrowing-verdict.outputs.verdict != 'MET' || (needs.go-product-shard.outputs.full0 == 'FULL' && needs.go-product-shard.outputs.full1 == 'FULL' && needs.go-product-shard.outputs.full2 == 'FULL' && needs.go-product-shard.outputs.full3 == 'FULL' && needs.go-product-shard.outputs.full4 == 'FULL' && needs.go-product-shard.outputs.full5 == 'FULL' && needs.go-product-shard.outputs.full6 == 'FULL' && needs.go-product-shard.outputs.full7 == 'FULL')) && (needs.docs-plan.result != 'success' || (needs.docs-plan.outputs.mode != 'DOCS' && needs.docs-plan.outputs.mode != 'REUSE')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Must equal the go-product-shard matrix length and REUSE_SHARDS.
      SHARDS: "8"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Record the tested tree
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if ! head=$(git rev-parse --verify -q "$GITHUB_SHA^2") || git rev-parse --verify -q "$GITHUB_SHA^3" > /dev/null; then
            echo 'AFP-V0-170: the tested commit is not a two-parent merge; no tree is recorded.'
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$head" != "$PR_HEAD" ]; then
            echo 'AFP-V0-170: the tested merge does not name the pull-request head; no tree is recorded.'
            exit 0
          fi
          tree=$(git rev-parse --verify -q "$GITHUB_SHA^{tree}")
          printf 'corvint-ci-tested-tree/1 tree=%s target=%s head=%s shards=%s\n' "$tree" "$GITHUB_SHA" "$head" "$SHARDS"

  ci-narrowed-tree-record:
    # AFP-V0-734 (V1-3064): the only evidence a merge-queue REUSE of a narrowed pull-request run
    # accepts. In a pull-request run whose verdict was MET and in which some shard narrowed, after
    # go-product passed (so AFP-V0-591 proved every shard ran its part of one balanced placement of
    # one selection) and every shard succeeded, it prints the tested tree, the tested merge, its
    # first parent and its second parent as one fixed line, only when that first parent is the
    # event's base.sha, the base the shards selected over (a recomputed merge ref may differ). Like
    # ci-tested-tree-record it runs no repository code and persists no credentials, and only
    # ci.yml changes what it prints. A merge-queue entry reuses that run only when its own tree
    # and first parent equal the record's (tools/ci-reuse-plan), so the selection covered the
    # same range; a main push never reuses it. Any mismatch prints no record; it never fails CI.
    needs: [docs-plan, narrowing-verdict, go-product-shard, go-product]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.go-product.result == 'success' && needs.go-product-shard.result == 'success' && needs.narrowing-verdict.outputs.verdict == 'MET' && !(needs.go-product-shard.outputs.full0 == 'FULL' && needs.go-product-shard.outputs.full1 == 'FULL' && needs.go-product-shard.outputs.full2 == 'FULL' && needs.go-product-shard.outputs.full3 == 'FULL' && needs.go-product-shard.outputs.full4 == 'FULL' && needs.go-product-shard.outputs.full5 == 'FULL' && needs.go-product-shard.outputs.full6 == 'FULL' && needs.go-product-shard.outputs.full7 == 'FULL') && needs.docs-plan.result == 'success' && needs.docs-plan.outputs.mode != 'DOCS' && needs.docs-plan.outputs.mode != 'REUSE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Must equal the go-product-shard matrix length and REUSE_SHARDS.
      SHARDS: "8"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Record the tested tree and the selection base
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if ! head=$(git rev-parse --verify -q "$GITHUB_SHA^2") || git rev-parse --verify -q "$GITHUB_SHA^3" > /dev/null; then
            echo 'AFP-V0-734: the tested commit is not a two-parent merge; no tree is recorded.'
            exit 0
          fi
          if [ "$head" != "$PR_HEAD" ]; then
            echo 'AFP-V0-734: the tested merge does not name the pull-request head; no tree is recorded.'
            exit 0
          fi
          base=$(git rev-parse --verify -q "$GITHUB_SHA^1")
          if [ "$base" != "$PR_BASE" ]; then
            echo 'AFP-V0-734: the tested merge is not built on the base its selection covered; no tree is recorded.'
            exit 0
          fi
          tree=$(git rev-parse --verify -q "$GITHUB_SHA^{tree}")
          printf 'corvint-ci-tested-tree/2 scope=NARROWED tree=%s target=%s base=%s head=%s shards=%s\n' "$tree" "$GITHUB_SHA" "$base" "$head" "$SHARDS"

  static-reuse:
    # AFP-V0-080 (V1-1642): a main push whose own commit already passed go-static,
    # artifact-integrity and go-interop in a successful merge-queue run of this workflow skips
    # those three jobs. The queue run tested this exact commit, so the same tree, ci.yml and
    # Makefile. Only listings are read (public, as in the docs-plan reuse step); nothing is
    # checked out or downloaded. Any failure, refusal or unreadable listing leaves `mode` empty,
    # and the three jobs then run in full. It never runs for a pull request or queue entry.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.find.outputs.mode }}
    steps:
      - name: Find a passed merge-queue run of this exact commit
        id: find
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          get() {
            curl -fsS --max-time 30 --max-filesize 4194304 -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" -o "$2" "$1" ||
              curl -fsS --max-time 30 --max-filesize 4194304 -H 'Accept: application/vnd.github+json' -o "$2" "$1"
          }
          d="$RUNNER_TEMP/static-reuse"
          mkdir -p "$d"
          get "$api/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=merge_group&status=success&per_page=20" "$d/runs.json"
          ids=$(jq -r --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '.workflow_runs[]?
            | select(.head_sha == $sha and .event == "merge_group" and .conclusion == "success"
              and .path == ".github/workflows/ci.yml" and .head_repository.full_name == $repo
              and (.head_branch | startswith("gh-readonly-queue/main/")) and (.id | type == "number"))
            | .id' "$d/runs.json" | head -n 5)
          for id in $ids; do
            get "$api/runs/$id/jobs?filter=latest&per_page=100" "$d/jobs-$id.json" || continue
            # Exactly one latest job of each name, every one success on this commit.
            if jq -e --arg sha "$GITHUB_SHA" '[.jobs[]? | select(.name == "go-static" or .name == "artifact-integrity" or .name == "go-interop")]
              | length == 3 and (map(.name) | unique | length == 3)
                and all(.conclusion == "success" and .head_sha == $sha)' "$d/jobs-$id.json" > /dev/null; then
              echo "Static reuse (AFP-V0-080): go-static, artifact-integrity and go-interop passed on $GITHUB_SHA in merge-queue run $id; not rerun." >> "$GITHUB_STEP_SUMMARY"
              echo 'mode=REUSE' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Static reuse (AFP-V0-080): no successful merge-queue run passed all three jobs on $GITHUB_SHA; they run in full." >> "$GITHUB_STEP_SUMMARY"

  go-static:
    # V1-1093: the static, formatting, build, protected-helper and interop checks that shard 0
    # ran serially after its race tests. They need no docs-plan output, so they start at once,
    # beside the shards, on every path that starts the shards (FULL, DOCS and REUSE alike).
    # AFP-V0-013 keeps them full; go-product needs this job, so its required coverage is
    # unchanged. Like the shards, a ci:batched constituent (AFP-V0-027) never starts it, and a
    # main push whose queue run passed it on the same commit reuses that result (AFP-V0-080).
    needs: static-reuse
    if: ${{ !cancelled() && !contains(github.event.pull_request.labels.*.name, 'ci:batched') && needs.static-reuse.outputs.mode != 'REUSE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
      GOWORK: "off"
      GOFLAGS: ""
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: source
          ref: ${{ github.sha }}
          # Depth 2 keeps the pull-request merge commit's base parent for the AFP-V0-042 diff.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: "1.27.3"
      - name: Full static, formatting and build checks
        working-directory: source
        run: |
          test -z "$(gofmt -l cmd internal tools .github/cishards .github/testconfine)"
          go vet ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
      - name: Windows vet including test files (AFP-V0-042)
        # go build skips _test.go files, so a test that breaks only for GOOS=windows reached main
        # (V1-1117). Skipped only on a pull request whose merge commit provably changes no .go,
        # go.mod or go.sum file against its base; any doubt runs the vet.
        working-directory: source
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$PR_BASE" ] &&
            [ "$(git rev-parse -q --verify 'HEAD^1' || true)" = "$PR_BASE" ] &&
            git diff --quiet "$PR_BASE" HEAD -- '*.go' '*go.mod' '*go.sum'; then
            echo 'Windows vet skipped: no .go, go.mod or go.sum file changed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet ./...
          (cd interop/cem01-go && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet ./...)
      - name: Protected helper self-tests independently of PR module directives
        working-directory: source
        run: |
          # The same isolated modules go-product-shard builds its helpers from, so tested
          # go.mod/replace directives cannot redirect what these tests exercise.
          export GOENV=off GOWORK=off GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off GOFLAGS=
          d="$RUNNER_TEMP/ci-shards-source"
          mkdir -p "$d/cmd"
          cp .github/cishards/partition.go .github/cishards/partition_test.go .github/cishards/order.go .github/cishards/order_test.go .github/cishards/slices.go .github/cishards/slices_test.go .github/cishards/package-costs.json .github/cishards/test-split-allow.json .github/cishards/test-slices.json "$d/"
          cp .github/cishards/cmd/main.go "$d/cmd/"
          printf 'module github.com/Beamfall/corvint/.github/cishards\n\ngo 1.27.3\n' > "$d/go.mod"
          t="$RUNNER_TEMP/test-confine-source"
          mkdir -p "$t/cmd"
          cp .github/testconfine/scopes.go .github/testconfine/scopes_test.go .github/testconfine/landlock_linux.go .github/testconfine/landlock_linux_test.go .github/testconfine/landlock_other.go "$t/"
          cp .github/testconfine/cmd/main.go .github/testconfine/cmd/exec_unix.go .github/testconfine/cmd/exec_other.go "$t/cmd/"
          printf 'module github.com/Beamfall/corvint/.github/testconfine\n\ngo 1.27.3\n' > "$t/go.mod"
          for m in "$d" "$t"; do
            (
              cd "$m"
              go test -race -count=1 -timeout 30m ./...
              go vet ./...
              CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
            )
          done
      - name: Nested module tools/local-authority tests and vet (CIN-V0-008)
        # V1-3329: the only CI run of this nested module's tests. It runs on every path that
        # starts go-static, so it covers every change a plan can carry to the module, its own
        # files included. Its two external modules are fetched once, verified against the
        # module's go.sum (-mod=readonly fails on a missing or mismatched hash); the tests and
        # vet then run with GOPROXY off, as every other Go step does.
        working-directory: source/tools/local-authority
        run: |
          GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org GOFLAGS=-mod=readonly go mod download
          go test -count=1 -timeout 30m ./...
          go vet ./...
      - name: Independent interop under production toolchain
        # AFP-V0-380 (V1-1103): the only run of interop/cem01-go's tests and vet in this workflow.
        working-directory: source/interop/cem01-go
        run: |
          go test -count=1 -timeout 30m ./...
          go vet ./...

  go-product:
    # The required check. A needed job that fails, is cancelled or is skipped is not success,
    # except the AFP-V0-027 skip of a ci:batched pull request, which the merge queue tests.
    if: always()
    needs: [go-product-shard, go-static, docs-plan, static-reuse]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch the shard coverage markers (AFP-V0-591)
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.go-product-shard.result == 'success'
        # The next step reads them only for a pull request or merge-queue entry whose shards all
        # succeeded (AFP-V0-732).
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-coverage-*
          path: ${{ runner.temp }}/ci-coverage
      - name: Every go-product shard and the static job succeeded
        env:
          SHARDS_RESULT: ${{ needs.go-product-shard.result }}
          STATIC_RESULT: ${{ needs.go-static.result }}
          STATIC_REUSE: ${{ needs.static-reuse.outputs.mode }}
          DOCS_RESULT: ${{ needs.docs-plan.result }}
          DOCS_MODE: ${{ needs.docs-plan.outputs.mode }}
          BATCHED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:batched') }}
          # AFP-V0-591: must equal the go-product-shard matrix length.
          SHARDS: "8"
        run: |
          # AFP-V0-027 (V1-2265): a ci:batched pull request's shards and go-static never start, and
          # this check passes with a notice instead of failing, so a lane PR is not red. It still
          # cannot land untested: main's merge_queue rule sends every merge through a merge_group
          # run, where the label is off and, with no AFP-V0-170 record for this skipped run, the
          # shards run FULL.
          if [ "$BATCHED" = true ] && [ "$SHARDS_RESULT" = skipped ] && [ "$STATIC_RESULT" = skipped ]; then
            test "$DOCS_RESULT" = success
            msg='go-product shards did not run: this pull request is labelled ci:batched (AFP-V0-027). Nothing was tested here; its batch pull request and the merge queue run the full suite. Remove the label and push (or close and reopen) to test it alone.'
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # CIN-V0-007: shards skipped at job level only for a passed DOCS or REUSE decision.
          if [ "$SHARDS_RESULT" = skipped ] && [ "$DOCS_RESULT" = success ] && { [ "$DOCS_MODE" = DOCS ] || [ "$DOCS_MODE" = REUSE ]; }; then
            echo "CIN-V0-007: no go-product shard started (docs-plan $DOCS_MODE)."
          else
            test "$SHARDS_RESULT" = success
          fi
          # AFP-V0-080: only a main push whose queue run passed go-static on this commit skips it.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$STATIC_REUSE" = REUSE ] && [ "$STATIC_RESULT" = skipped ]; then
            echo 'go-static reused from the merge-queue run of this commit (AFP-V0-080).'
          else
            test "$STATIC_RESULT" = success
          fi
          test "$DOCS_RESULT" = success
          # AFP-V0-591: a NARROWED shard with the BALANCED placement (AFP-V0-590) runs only its
          # part of the cost-balanced placement of the selection, so a pull request is covered
          # only when each shard 0 to SHARDS-1 left exactly one marker of this run and either every
          # marker is PARTITION (AFP-V0-028: no selected package is omitted) or every marker is
          # BALANCED with one selection. It fails closed: no marker, a missing or extra shard, a
          # marker of another run or a later attempt, or a mix fails. A marker of an earlier
          # attempt of this run counts, since each shard keeps the latest marker it uploaded for
          # the same tested merge and the agreement rule admits a mix of attempts only when they
          # are consistent. DOCS and REUSE, whose shards run no tests step, leave no marker.
          # AFP-V0-732: a merge-queue entry, which may narrow too, is checked the same way.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] || [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            if [ "$DOCS_MODE" = DOCS ] || [ "$DOCS_MODE" = REUSE ]; then
              echo "AFP-V0-591: no shard ran a tests step (docs-plan $DOCS_MODE); no coverage marker is required"
            else
              markers="$RUNNER_TEMP/ci-coverage"
              result=$( { [ ! -d "$markers" ] || find "$markers" -name coverage.json -type f -exec cat {} +; } |
                jq -s -r --arg runId "${GITHUB_RUN_ID:-}" --arg runAttempt "${GITHUB_RUN_ATTEMPT:-}" --arg shards "$SHARDS" '
                [.[] | select(type == "object")] as $m
                | ($shards | tonumber) as $n
                | ($runAttempt | if test("^[1-9][0-9]*$") then tonumber else null end) as $attempt
                | [$m[] | select(.placement == "BALANCED")] as $b
                | [ (if ($m | length) == 0 then "no shard coverage marker was found" else empty end),
                    (if ($m | length) > 0 and ([$m[].shard] | sort) != [range(0; $n)] then "the markers name shards \([$m[].shard] | sort | map(tostring) | join(",")), want 0 to \($n - 1)" else empty end),
                    (if any($m[]; .profile != "corvint-pr-coverage/0") then "a marker is not corvint-pr-coverage/0" else empty end),
                    (if any($m[]; .shards != $n) then "a marker names another shard count than \($n)" else empty end),
                    (if any($m[]; .runId != $runId) then "a marker is from another run" else empty end),
                    (if any($m[]; (.runAttempt | type) != "string" or (.runAttempt | test("^[1-9][0-9]*$") | not)
                        or $attempt == null or (.runAttempt | tonumber) > $attempt) then "a marker names no attempt of this run up to this one" else empty end),
                    (if any($m[]; .placement != "BALANCED" and .placement != "PARTITION") then "a marker names an unknown placement" else empty end),
                    (if ($b | length) > 0 and ($b | length) != ($m | length) then "\(($m | length) - ($b | length)) shard(s) covered only their partition while others ran a balanced placement" else empty end),
                    (if ($b | length) > 0 and ([$b[].selected] | unique | length) != 1 then "the balanced shards placed different selections" else empty end)
                  ] as $gaps
                | if ($gaps | length) > 0 then "AFP-V0-591: the shard coverage is not proven: \($gaps | join("; ")). Re-run all jobs."
                  elif ($b | length) == 0 then "AFP-V0-591: covered; all \($n) shards ran their partition"
                  else "AFP-V0-591: covered; all \($n) shards ran their part of one balanced placement of \($b[0].selected | length) selected package(s)" end') || result=
              echo "$result" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              case $result in
                "AFP-V0-591: covered"*) echo "$result" ;;
                *) echo "::error::${result:-AFP-V0-591: the shard coverage markers are unreadable. Re-run all jobs.}"; exit 1 ;;
              esac
            fi
          fi

  ci-shard-cost-drift:
    # AFP-V0-040: advisory drift report for .github/cishards/package-costs.json from this run's
    # shard outcomes. It is not a required check: it never fails on a finding, never changes
    # shard membership or placement, posts no commit status and never writes the table.
    # Refreshing the table stays an operator step (AFP-V0-022). Anything but every shard's
    # outcomes abstains with its reason. A ci:batched constituent has no shard outcomes (AFP-V0-081).
    if: ${{ always() && !cancelled() && !contains(github.event.pull_request.labels.*.name, 'ci:batched') }}
    needs: go-product-shard
    runs-on: ubuntu-24.04
    # Every step is continue-on-error and their timeouts sum below this one, so no failure,
    # timeout or abstention ends the job red.
    continue-on-error: true
    timeout-minutes: 20
    env:
      # Must equal the go-product-shard matrix, or every run abstains.
      SHARDS: "8"
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
      GOWORK: "off"
      GOFLAGS: ""
    steps:
      - name: Fetch shard package outcomes
        if: needs.go-product-shard.result == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-shard-costs-*
          merge-multiple: true
          path: ${{ runner.temp }}/shard-costs
      - name: Require the outcomes of every shard
        id: complete
        continue-on-error: true
        timeout-minutes: 1
        env:
          SHARDS_RESULT: ${{ needs.go-product-shard.result }}
        run: |
          d="$RUNNER_TEMP/shard-costs"
          have=$(find "$d" -maxdepth 1 -name 'shard-*.json' -type f 2>/dev/null | wc -l | tr -d ' ')
          # AFP-V0-422: a shard on the self-hosted runner retains only a marker.
          boxed=$(find "$d" -maxdepth 1 -name 'shard-*.self-hosted' -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$SHARDS_RESULT" != success ]; then
            reason="go-product-shard result is $SHARDS_RESULT"
          elif [ "$boxed" -ne 0 ]; then
            reason="$boxed of $SHARDS shards ran on the self-hosted runner, whose timings are not cloud timings (AFP-V0-422)"
            [ "$boxed" -ne "$SHARDS" ] || echo 'boxed=1' >> "$GITHUB_OUTPUT"
          elif [ "$have" -ne "$SHARDS" ]; then
            reason="$have of $SHARDS shard outcome artifacts present (a docs-only, reused or selected run executes no complete shard)"
          else
            echo 'ok=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '### CI shard cost table drift (advisory, AFP-V0-040)\n\nAbstained: %s; a partial run cannot measure the table.\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          echo 'summarized=1' >> "$GITHUB_OUTPUT"
      - name: Report the self-hosted shard balance (advisory, AFP-V0-460)
        # V1-1753: the per-package report abstains on self-hosted shards (AFP-V0-422), so the
        # spread of their summed package times is the staleness signal. It never fails.
        if: steps.complete.outputs.boxed == '1'
        continue-on-error: true
        timeout-minutes: 1
        env:
          BOUND_PERCENT: "125"
        run: |
          d="$RUNNER_TEMP/shard-costs"
          sums="" n=0 i=0
          while [ "$i" -lt "$SHARDS" ]; do
            s=$(sed -n 's/^packageSeconds=\([0-9][0-9]*\)$/\1/p' "$d/shard-$i.self-hosted" 2>/dev/null | head -n 1)
            [ -z "$s" ] || { sums="$sums $s"; n=$((n + 1)); }
            i=$((i + 1))
          done
          heading='### CI shard balance (advisory, AFP-V0-460)'
          if [ "$n" -ne "$SHARDS" ]; then
            printf '\n%s\n\nNot measured: %s of %s self-hosted shards recorded their package time.\n' "$heading" "$n" "$SHARDS" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          max=0 total=0
          for s in $sums; do total=$((total + s)); [ "$s" -le "$max" ] || max=$s; done
          if [ "$total" -eq 0 ]; then
            printf '\n%s\n\nNot measured: the shards recorded no package time.\n' "$heading" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mean=$((total / SHARDS)) pct=$((max * 100 * SHARDS / total))
          line="slowest shard ${max} s of package time is ${pct} percent of the ${mean} s mean over $SHARDS self-hosted shards (bound ${BOUND_PERCENT} percent; shards:${sums})"
          printf '\n%s\n\n%s.\n' "$heading" "$line" >> "$GITHUB_STEP_SUMMARY"
          echo "AFP-V0-460: $line"
          # Compare before rounding, so 125.5 percent still exceeds a 125 percent bound.
          if [ $((max * 100 * SHARDS)) -gt $((BOUND_PERCENT * total)) ]; then
            echo "::warning title=CI shard balance::$line; .github/cishards/package-costs.json and test-slices.json no longer balance the shards and are due for a refresh (AFP-V0-022, AFP-V0-060)"
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        id: checkout
        if: steps.complete.outputs.ok == '1'
        continue-on-error: true
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        if: steps.complete.outputs.ok == '1' && steps.checkout.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        with:
          cache: false
          go-version: "1.27.3"
      - name: Report cost drift (advisory; findings never fail)
        id: report
        if: steps.complete.outputs.ok == '1' && steps.setup-go.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if ! go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/ci-shard-costs" ./tools/ci-shard-costs; then
            printf '### CI shard cost table drift (advisory, AFP-V0-040)\n\nAbstained: tools/ci-shard-costs did not build. No finding is reported for this run.\n' >> "$GITHUB_STEP_SUMMARY"
            echo 'summarized=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=0
          "$RUNNER_TEMP/ci-shard-costs" check --advisory --shards "$SHARDS" --summary "$GITHUB_STEP_SUMMARY" \
            "$RUNNER_TEMP"/shard-costs/shard-*.json || code=$?
          echo "ci-shard-costs check --advisory exited $code (2 means it abstained; see the job summary)"
          # 0 reports and 2 abstains, each into the summary; any other exit leaves it to the fallback.
          if [ "$code" = 0 ] || [ "$code" = 2 ]; then
            echo 'summarized=1' >> "$GITHUB_OUTPUT"
          fi
      - name: Record why no drift report was written
        if: always() && steps.complete.outputs.summarized != '1' && steps.report.outputs.summarized != '1'
        continue-on-error: true
        timeout-minutes: 1
        env:
          COMPLETE: ${{ steps.complete.outcome }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_GO: ${{ steps.setup-go.outcome }}
          REPORT: ${{ steps.report.outcome }}
        run: |
          if [ "$COMPLETE" != success ]; then
            reason="the shard outcome check ended $COMPLETE"
          elif [ "$CHECKOUT" != success ]; then
            reason="checkout ended $CHECKOUT"
          elif [ "$SETUP_GO" != success ]; then
            reason="setup-go ended $SETUP_GO"
          else
            reason="the report step ended $REPORT without a report"
          fi
          printf '### CI shard cost table drift (advisory, AFP-V0-040)\n\nAbstained: %s. No finding is reported for this run.\n' "$reason" >> "$GITHUB_STEP_SUMMARY"

  go-interop:
    # Not a required check. AFP-V0-081: a ci:batched constituent never starts it (its batch pull
    # request and queue entry run it on the combined tree); AFP-V0-080: a main push reuses the
    # passed merge-queue run of the same commit. AFP-V0-380 (V1-1103): interop/cem01-go's tests
    # and vet run once, in go-static (which go-product needs); this job keeps only the formatting
    # and Windows build checks go-static does not run for that module.
    needs: static-reuse
    if: ${{ !cancelled() && !contains(github.event.pull_request.labels.*.name, 'ci:batched') && needs.static-reuse.outputs.mode != 'REUSE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: "1.27.3"
      - name: Go gate
        working-directory: interop/cem01-go
        env:
          GOFLAGS: ""
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOWORK: "off"
        run: |
          test -z "$(gofmt -l .)"
          GOOS=windows GOARCH=amd64 go build ./...

  artifact-integrity:
    # Not a required check; skipped as go-interop is (AFP-V0-080, AFP-V0-081).
    # AFP-V0-163 (V1-2113): a merge-queue entry whose tree a successful pull-request run of its
    # second parent already verified skips the archive gate and still concludes success, so the
    # AFP-V0-080 push reuse keeps working. The tree holds ci.yml, the Makefile, go.mod and every
    # gate input, and the gate reads no network (GOPROXY off), so an equal tree is an equal
    # verdict. The tested tree is read only from the log of that run's artifact-integrity-record
    # job, which no repository code writes; artifact names are never trusted. Any mismatch,
    # refusal or unreadable listing or log runs the gate in full.
    needs: static-reuse
    if: ${{ !cancelled() && !contains(github.event.pull_request.labels.*.name, 'ci:batched') && needs.static-reuse.outputs.mode != 'REUSE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Find a passed pull-request verdict for this tree
        id: reuse
        if: github.event_name == 'merge_group'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          tree=$(git rev-parse --verify -q "$GITHUB_SHA^{tree}")
          if ! head=$(git rev-parse --verify -q "$GITHUB_SHA^2") || git rev-parse --verify -q "$GITHUB_SHA^3" > /dev/null; then
            echo 'Artifact integrity (AFP-V0-163): the queue commit is not a two-parent merge; the gate runs in full.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          get() {
            curl -fsSL --max-time 30 --max-filesize 4194304 -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" -o "$2" "$1" ||
              curl -fsSL --max-time 30 --max-filesize 4194304 -H 'Accept: application/vnd.github+json' -o "$2" "$1"
          }
          re='^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z )?corvint-ci-integrity-tree/0 tree=[0-9a-f]{40} target=[0-9a-f]{40} head=[0-9a-f]{40}$'
          d="$RUNNER_TEMP/integrity-reuse"
          mkdir -p "$d"
          get "$api/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success&per_page=20" "$d/runs.json"
          ids=$(jq -r --arg sha "$head" --arg repo "$GITHUB_REPOSITORY" '.workflow_runs[]?
            | select(.head_sha == $sha and .event == "pull_request" and .conclusion == "success"
              and .path == ".github/workflows/ci.yml" and .repository.full_name == $repo and (.id | type == "number"))
            | .id' "$d/runs.json" | head -n 5)
          for id in $ids; do
            get "$api/runs/$id/jobs?filter=latest&per_page=100" "$d/jobs-$id.json" || continue
            # Exactly one latest artifact-integrity job and exactly one latest record job of
            # this run, both passed on the pull-request head; the record job's id is kept.
            job=$(jq -r --arg sha "$head" --argjson id "$id" '[.jobs[]? | select(.name == "artifact-integrity" or .name == "artifact-integrity-record")]
              | if length == 2 and (map(.name) | unique | length == 2)
                  and all(.conclusion == "success" and .head_sha == $sha and .run_id == $id)
                then (.[] | select(.name == "artifact-integrity-record") | .id | select(type == "number")) else empty end' \
              "$d/jobs-$id.json") || continue
            test -n "$job" || continue
            get "$api/jobs/$job/logs" "$d/log-$job.txt" || continue
            # Exactly one record line in that job's own log, naming this tree and this head.
            n=$(tr -d '\r' < "$d/log-$job.txt" | grep -cE "$re" || true)
            test "$n" = 1 || continue
            line=$(tr -d '\r' < "$d/log-$job.txt" | grep -E "$re")
            test "$(printf '%s\n' "$line" | sed -E 's/.* tree=([0-9a-f]{40}) .*/\1/')" = "$tree" || continue
            test "$(printf '%s\n' "$line" | sed -E 's/.* head=([0-9a-f]{40})$/\1/')" = "$head" || continue
            printf '{"profile":"corvint-ci-integrity-reuse/0","mode":"REUSE","tree":"%s","head":"%s","target":"%s","runId":%s,"recordJobId":%s}\n' \
              "$tree" "$head" "$GITHUB_SHA" "$id" "$job" > "$d/decision.json"
            cat "$d/decision.json" >> "$GITHUB_STEP_SUMMARY"
            echo "Artifact integrity (AFP-V0-163): tree $tree passed in pull-request run $id (record job $job); the gate is not rerun." >> "$GITHUB_STEP_SUMMARY"
            echo 'mode=REUSE' >> "$GITHUB_OUTPUT"
            exit 0
          done
          echo "Artifact integrity (AFP-V0-163): no successful pull-request run of $head recorded tree $tree; the gate runs in full." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain integrity reuse decision
        # Diagnostic only; nothing reads it back.
        if: steps.reuse.outputs.mode == 'REUSE'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-integrity-reuse
          path: ${{ runner.temp }}/integrity-reuse/decision.json
          if-no-files-found: ignore
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.reuse.outputs.mode != 'REUSE'
        with:
          cache: false
          go-version: "1.27.3"
      - name: Verify native Go archives
        if: steps.reuse.outputs.mode != 'REUSE'
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOWORK: "off"
        run: make go-archive-gate

  artifact-integrity-record:
    # AFP-V0-163: the only evidence the merge-queue reuse above accepts. It runs in a pull-request
    # run only after artifact-integrity passed there, and prints the tested tree and the
    # pull-request head as one fixed line to this job's own log. It runs no repository code (no
    # go, make or repo script; checkout and git only) and persists no credentials, so a test, build step
    # or fork pull request in another job cannot write this log. Only ci.yml, gated by the
    # ci-control-plane admin review, changes what it prints, and that ci.yml is part of the
    # tree the queue entry must equal.
    needs: artifact-integrity
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.artifact-integrity.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Record the verified tree
        id: record
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse --verify -q "$GITHUB_SHA^2")" = "$PR_HEAD"
          tree=$(git rev-parse --verify -q "$GITHUB_SHA^{tree}")
          printf 'corvint-ci-integrity-tree/0 tree=%s target=%s head=%s\n' "$tree" "$GITHUB_SHA" "$PR_HEAD"

  cce-live:
    # AFP-V0-433 (V1-1687): the live CCE prove tests (`make cce-live`, CCE-V0-102) on the macOS arm64
    # tuple they were qualified on. The job always starts, so its check is never left pending, and
    # runs the tests only when the tested commit changes internal/changee2e or this workflow against
    # its first parent (AFP-V0-434); otherwise it passes with a summary line. It fails, rather than
    # passes, when the installed toolchain is not the qualified tuple (AFP-V0-435). Not a required
    # check; a ci:batched constituent never starts it (AFP-V0-081).
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:batched') }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
      GOWORK: "off"
      GOFLAGS: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Depth 2 keeps the tested commit's first parent for the change check.
          fetch-depth: 2
          persist-credentials: false
      - name: Does the tested commit change internal/changee2e? (AFP-V0-434)
        id: changed
        run: |
          # Any doubt (no first parent in this checkout) runs the tests.
          if base=$(git rev-parse -q --verify 'HEAD^1') &&
            git diff --quiet "$base" HEAD -- internal/changee2e .github/workflows/ci.yml; then
            echo 'cce-live: internal/changee2e and this workflow are unchanged against the first parent; the live tests did not run.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'run=1' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.changed.outputs.run == '1'
        with:
          cache: false
          go-version: "1.27.3"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.changed.outputs.run == '1'
        with:
          node-version: "24.11.1"
      - name: Install Playwright 1.64.0 and its headless shell
        if: steps.changed.outputs.run == '1'
        env:
          # A registry fetch is this step's purpose; the Go steps keep GOPROXY off.
          npm_config_audit: "false"
          npm_config_fund: "false"
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-save @playwright/test@1.64.0
          npx playwright install chromium-headless-shell
      - name: Require the qualified Playwright tuple (AFP-V0-435)
        id: tuple
        if: steps.changed.outputs.run == '1'
        env:
          PW_DIR: ${{ runner.temp }}/pw
        run: |
          # The 1.64.0 tuple of qualifiedBundledBrowsers (internal/jstestprovider/external.go).
          want_build=1248
          want_version='Google Chrome for Testing 156.0.8078.4'
          want_node=v24.11.1
          rev=$(jq -r '[.browsers[]? | select(.name == "chromium-headless-shell") | .revision] | if length == 1 then .[0] else "missing" end' \
            "$PW_DIR/node_modules/playwright-core/browsers.json" 2> /dev/null) || rev=unreadable
          exe="$HOME/Library/Caches/ms-playwright/chromium_headless_shell-$want_build/chrome-headless-shell-mac-arm64/chrome-headless-shell"
          got=$("$exe" --version 2> /dev/null) || got="no runnable headless shell at $exe"
          node=$(node --version 2> /dev/null) || node=missing
          if [ "$rev" != "$want_build" ] || [ "$got" != "$want_version" ] || [ "$node" != "$want_node" ]; then
            msg="cce-live: Playwright pins headless shell build $rev, which reports '$got', under node $node; the qualified tuple is build $want_build reporting '$want_version' under node $want_node, so qualify would refuse these receipts. The job fails instead of passing."
            echo "::error::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "cce-live: headless shell build $rev ($got), node $node." >> "$GITHUB_STEP_SUMMARY"
      - name: Live CCE prove tests
        if: steps.changed.outputs.run == '1'
        env:
          CORVINT_PLAYWRIGHT_MODULES: ${{ runner.temp }}/pw/node_modules
          CORVINT_E2E_NODE_BIN: node
        run: |
          mkdir -p "$RUNNER_TEMP/cce-live"
          set -o pipefail
          make cce-live 2>&1 | tee "$RUNNER_TEMP/cce-live/output.txt"
      - name: Retain the live test output
        if: always() && steps.changed.outputs.run == '1'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cce-live
          path: ${{ runner.temp }}/cce-live/output.txt
          if-no-files-found: ignore
