name: CI

on:
  pull_request:
  # A merge-queue entry tests the exact commit that becomes main: every pull_request-gated
  # narrowing below is off for it, so docs-plan selects FULL (AFP-V0-026) unless its tree is
  # the one its pull-request run already tested in full (REUSE, AFP-V0-046).
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  # AFP-V0-082 (V1-0728): a pull request cancels its superseded run; a merge-queue entry is its
  # own queue ref; a main push groups by its own commit, so a later merge never cancels it.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doc-gates:
    # Fast signal (a few minutes) for the checks go-product never runs or reports only after
    # about an hour: the Makefile's documentation GATE_STEPS (V1-0244) and the use-case receipt
    # pins (V1-0268). They read the Git index or worktree of this clean checkout, except the
    # host package version gate (AHI-020, V1-0782), which reads committed history.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
      GOWORK: "off"
      GOFLAGS: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: "1.27.2"
      - name: Host package versions (AHI-020)
        run: make -s host-package-versions-check host-package-versions-test
      - name: Documentation gate steps
        run: make -s spec-requirements-check requirement-definitions-check traceability-tests-check decision-numbers-check line-citations-check error-code-ownership-check unbounded-readers-check test-read-scopes-check test-commands-check
      - name: Use-case receipt pins (run script/repin-use-case-receipts.sh on failure)
        run: |
          make -s use-case-receipts-check use-case-receipts-test
          go run ./conformance/use-cases-v0

  docs-plan:
    # DCI-V0: only trusted event-base code may classify the tested merge. This
    # job always runs; absent tools/qualification select FULL, never an empty skip.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # AFP-V0-170: the reuse step reads the record job's log, which needs actions: read.
    permissions:
      actions: read
      contents: read
    outputs:
      mode: ${{ steps.reuse.outputs.mode || steps.plan.outputs.mode }}
    env:
      GOTOOLCHAIN: local
      GOENV: "off"
      GOPROXY: "off"
      GOSUMDB: "off"
      GOWORK: "off"
      GOFLAGS: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: source
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: trusted-docs
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: "1.27.2"
      - name: Classify and verify immutable documentation inputs
        id: plan
        working-directory: trusted-docs
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          TESTED_MERGE: ${{ github.sha }}
        run: |
          mode=FULL
          echo 'mode=FULL' >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || [ ! -f tools/docs-ci-plan/main.go ]; then
            echo 'Full CI: main/push or trusted documentation classifier unavailable.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test "$(git rev-parse HEAD)" = "$PR_BASE"
          if ! go build -trimpath -o "$RUNNER_TEMP/docs-ci-plan" ./tools/docs-ci-plan; then
            echo 'Full CI: trusted documentation classifier could not build.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A classifier refusal exits zero with FULL. An admitted document that
          # fails verification exits nonzero and must fail this required dependency.
          "$RUNNER_TEMP/docs-ci-plan" --root "$GITHUB_WORKSPACE/source" \
            --base "$PR_BASE" --head "$PR_HEAD" --target "$TESTED_MERGE" \
            > "$RUNNER_TEMP/docs-ci-plan.json"
          cat "$RUNNER_TEMP/docs-ci-plan.json" >> "$GITHUB_STEP_SUMMARY"
          if jq -e --arg base "$PR_BASE" --arg head "$PR_HEAD" --arg target "$TESTED_MERGE" \
            '.profile == "corvint-docs-ci/0" and .mode == "DOCS" and .verified == true and .base == $base and .head == $head and .target == $target' \
            "$RUNNER_TEMP/docs-ci-plan.json" > /dev/null; then
            mode=DOCS
            (cd "$GITHUB_WORKSPACE/source" && go test -race -count=1 -timeout 30m ./tools/docs-ci-plan ./internal/specindex)
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: Retain documentation decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-ci-plan
          path: ${{ runner.temp }}/docs-ci-plan.json
          if-no-files-found: ignore
      - name: Find a passed result for this exact tree
        # AFP-V0-024: a main push whose tree a successful pull-request run, or the merge-queue
        # run of the pushed commit itself (V1-0760), already tested in full skips only the root
        # race invocation; the decision tool is built from the pushed main commit. AFP-V0-046:
        # a merge-queue entry whose tree a successful pull-request run of its second parent
        # already tested in full does the same, only when its first parent is on main, with the
        # tool built from that first parent. Every failure here keeps FULL. REUSE_SHARDS must
        # equal the go-product-shard matrix, or no record line matches and CI runs FULL.
        # AFP-V0-170 (V1-2271): the tested tree is read only from the log of the reused run's
        # ci-tested-tree-record job, which runs no repository code; artifacts are never read.
        id: reuse
        if: github.event_name == 'push' || github.event_name == 'merge_group'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: trusted-docs
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_SHARDS: "8"
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          src="$GITHUB_WORKSPACE/source"
          tree=$(git -C "$src" rev-parse --verify -q "$GITHUB_SHA^{tree}")
          if ! head=$(git -C "$src" rev-parse --verify -q "$GITHUB_SHA^2") || git -C "$src" rev-parse --verify -q "$GITHUB_SHA^3" > /dev/null; then
            echo 'Full CI: the tested commit is not a two-parent merge.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tool="$PWD"
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            # Only the first entry on an unmoved main can have its pull-request run's tree; a
            # later entry is built on a preceding queue commit and stays FULL. The tool comes
            # from main code, never from the queue commit under test.
            base=$(git -C "$src" rev-parse --verify -q "$GITHUB_SHA^1")
            if ! git -C "$src" merge-base --is-ancestor "$base" refs/remotes/origin/main; then
              echo 'Full CI: the queue commit is not built directly on main.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            tool="$RUNNER_TEMP/ci-reuse-source"
            mkdir -p "$tool"
            git -C "$src" archive "$base" go.mod tools/ci-reuse-plan | tar -x -C "$tool"
          fi
          (cd "$tool" && go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/ci-reuse-plan" ./tools/ci-reuse-plan)
          d="$RUNNER_TEMP/ci-reuse"
          mkdir -p "$d/jobs" "$d/logs"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          # Run and job listings are public; a job log needs actions: read and redirects to
          # storage. The anonymous retry covers a token the API refuses.
          get() {
            curl -fsSL --max-time 30 --max-filesize 4194304 -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" -o "$2" "$1" ||
              curl -fsSL --max-time 30 --max-filesize 4194304 -H 'Accept: application/vnd.github+json' -o "$2" "$1"
          }
          # An unreadable listing leaves an empty file that contributes no run, so the tool
          # still retains a FULL decision when no listing is readable.
          runs=()
          list() {
            get "$api/workflows/ci.yml/runs?$1&status=success&per_page=20" "$d/$2" || : > "$d/$2"
            for id in $(jq -r '.workflow_runs[]?.id | select(type == "number")' "$d/$2" | head -n 5); do
              get "$api/runs/$id/jobs?filter=latest&per_page=100" "$d/jobs/$id.json" || continue
              for job in $(jq -r '.jobs[]? | select(.name == "ci-tested-tree-record") | .id | select(type == "number")' "$d/jobs/$id.json" | head -n 2); do
                get "$api/jobs/$job/logs" "$d/logs/$job.txt" || true
              done
            done
            runs+=(--runs "$d/$2")
          }
          list "head_sha=$head&event=pull_request" runs.json
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            list "head_sha=$GITHUB_SHA&event=merge_group" queue-runs.json
          fi
          "$RUNNER_TEMP/ci-reuse-plan" --repository "$GITHUB_REPOSITORY" --event "$GITHUB_EVENT_NAME" --tree "$tree" \
            --head "$head" --target "$GITHUB_SHA" --shards "$REUSE_SHARDS" "${runs[@]}" --jobs "$d/jobs" --logs "$d/logs" \
            > "$d/decision.json.partial"
          mv "$d/decision.json.partial" "$d/decision.json"
          cat "$d/decision.json" >> "$GITHUB_STEP_SUMMARY"
          if jq -e --arg tree "$tree" --arg head "$head" --argjson shards "$REUSE_SHARDS" \
            '.profile == "corvint-ci-reuse/0" and .mode == "REUSE" and .tree == $tree and .head == $head and (.runId | type == "number") and (.recordJobId | type == "number") and (.records | length == $shards)' \
            "$d/decision.json" > /dev/null; then
            echo 'mode=REUSE' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain reuse decision
        if: github.event_name == 'push' || github.event_name == 'merge_group'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-reuse
          path: ${{ runner.temp }}/ci-reuse/decision.json
          if-no-files-found: ignore
      - name: Plan affected-first package order from trusted base code (advisory)
        # AFP-V0-022: the plan only orders the complete universe inside each shard. The
        # planner is built from the event base, never the PR head; any failure here keeps
        # the current order and never changes which packages run.
        if: github.event_name == 'pull_request' && steps.plan.outputs.mode != 'DOCS'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: trusted-docs
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_BASE"
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/order-planner" ./cmd/corvint
          mkdir -p "$RUNNER_TEMP/affected-order"
          "$RUNNER_TEMP/order-planner" --root "$GITHUB_WORKSPACE/source" affected --base "$PR_BASE" \
            > "$RUNNER_TEMP/affected-order/plan.json.partial"
          mv "$RUNNER_TEMP/affected-order/plan.json.partial" "$RUNNER_TEMP/affected-order/plan.json"
      - name: Retain affected-first order plan
        if: github.event_name == 'pull_request' && steps.plan.outputs.mode != 'DOCS'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: affected-order
          path: ${{ runner.temp }}/affected-order/plan.json
          if-no-files-found: ignore

  narrowing-verdict:
    # AFP-V0-097 (V1-0812): a same-repository pull request into main may narrow its Go shards
    # only when the repository variable CORVINT_PR_NARROWING is `on` (unset by default) and
    # accept.sh, run from the pull request's base commit, accepts the newest trusted
    # afp-shadow-bar-epoch-<N> verdict of ci-forward-bar.yml. Any other outcome, a skipped job
    # or a failure of this job leaves `verdict` other than MET, and every shard runs full.
    # A fork pull request never runs it.
    if: github.event_name == 'pull_request' && vars.CORVINT_PR_NARROWING == 'on' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      verdict: ${{ steps.accept.outputs.verdict }}
      reason: ${{ steps.accept.outputs.reason }}
      verdictRun: ${{ steps.accept.outputs.verdictRun }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The pull request's base commit on main, never the tested head.
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          sparse-checkout: .github/forward-rows
          persist-credentials: false
      - name: Accept or refuse the trusted whole-epoch verdict
        id: accept
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Must equal CORVINT_PR_FORWARD_EPOCH below and FORWARD_EPOCH in ci-forward-bar.yml.
          FORWARD_EPOCH: "1"
          VERDICT_WORKFLOW: .github/workflows/ci-forward-bar.yml
        run: sh trusted/.github/forward-rows/accept.sh

  go-product-shard:
    needs: [docs-plan, narrowing-verdict]
    # AFP-V0-027: a pull request labelled ci:batched is a constituent of a batch pull request
    # that runs this suite on the combined tree, so its own race shards never start. The
    # skipped shard job fails go-product below; the label never makes a PR mergeable.
    if: ${{ always() && !cancelled() && !contains(github.event.pull_request.labels.*.name, 'ci:batched') }}
    # Partition the complete runtime package universe using advisory measured costs. An
    # admitted Corvint selection intersects those same disjoint partitions; mixed full
    # fallbacks cannot omit selected packages. go-product remains the required check.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    # Protected workflow/ruleset NOT_VERIFIED: owner review is required before enabling pins.
    # Promotion requires reviewed immutable tool/artifact pins. Empty pins keep full CI.
    env:
      CORVINT_PR_TOOL_SOURCE: ""
      # AFP-V0-047: the reviewed origin/main commit the shadow `corvint test` planner is built
      # from. It only plans (--dry-run) and never decides, executes or narrows, so it is pinned
      # apart from CORVINT_PR_TOOL_SOURCE: that pin builds the deciding driver, which only plans
      # for the AFP-V0-098 narrowing gate (--mode plan) and never executes tests. Empty stops
      # the shadow.
      CORVINT_TEST_SHADOW_SOURCE: "5163d1ed4b61084fc32cf79355848899c3e8a5bb"
      # AFP-V0-030: the forward-evidence epoch. Advanced to 1 when `corvint test` joined the
      # shadow (STR-V0-012 step 3), so no earlier row counts toward the AFP-V0-029 bar. The
      # first shadow rows of this epoch come from the AFP-V0-047 shadow pin above. Must equal
      # FORWARD_EPOCH in ci-control-plane.yml, which names the rows.
      CORVINT_PR_FORWARD_EPOCH: "1"
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
      GOWORK: "off"
      GOFLAGS: ""
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: source
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          cache: false
          go-version: "1.27.2"
      - name: Restore the trusted Go build cache (main pushes and merge-queue entries only)
        # V1-1098: compiled packages only, in Go's default GOCACHE outside the tested checkout,
        # so no read scope changes. Provenance: only a main push saves (below). A pull_request run
        # never restores, because GitHub searches the pull request's own merge-ref scope first,
        # and a pull request's workflow edits can write entries there. A main push sees only the
        # main scope; a merge-queue entry sees main plus its own single-use
        # gh-readonly-queue/main/pr-N-<sha> ref, which only that entry's tree writes to. The step
        # is off wherever the race invocation is off (DOCS, REUSE). The pinned narrowed driver,
        # which runs only for pull requests, keeps its own cold cache (AFP-V0-014/015).
        # -count=1 stays, so no test result is reused.
        id: gocache
        if: (needs.docs-plan.result != 'success' || (needs.docs-plan.outputs.mode != 'DOCS' && needs.docs-plan.outputs.mode != 'REUSE')) && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main'))
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-race-shard-${{ strategy.job-index }}-of-${{ strategy.job-total }}-${{ hashFiles('source/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ runner.arch }}-go${{ steps.go.outputs.go-version }}-race-shard-${{ strategy.job-index }}-of-${{ strategy.job-total }}-${{ hashFiles('source/go.sum') }}-
      - name: Provision the host tools the product's fixed PATH resolves
        # Child processes run under worksource.PlatformPath, which reaches Go through
        # /usr/local/go/bin rather than setup-go's tool cache. The dogfood shell tests use rg,
        # and the Git fixtures commit under the global identity. Automatic maintenance is off so
        # no detached `git maintenance` outlives a fixture commit and races its TempDir cleanup.
        # V1-1095: rg is the official ripgrep release binary, pinned by the SHA-256 that the
        # release publishes (docs/build-log/2026-10-10-ci-critical-path.md), not an apt install;
        # a checksum mismatch fails the step before anything is extracted.
        env:
          RG_VERSION: "15.2.0"
          RG_SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
        run: |
          sudo rm -rf /usr/local/go
          sudo ln -s "$(go env GOROOT)" /usr/local/go
          test "$(/usr/local/go/bin/go env GOVERSION)" = "go1.27.2"
          rg_name="ripgrep-$RG_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/$rg_name.tar.gz" \
            "https://github.com/BurntSushi/ripgrep/releases/download/$RG_VERSION/$rg_name.tar.gz"
          echo "$RG_SHA256  $RUNNER_TEMP/$rg_name.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$rg_name.tar.gz" -C "$RUNNER_TEMP" "$rg_name/rg"
          sudo install -m 0755 "$RUNNER_TEMP/$rg_name/rg" /usr/local/bin/rg
          rg_found=$(PATH=/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin command -v rg)
          test "$rg_found" = /usr/local/bin/rg
          case "$("$rg_found" --version | head -n 1)" in
            "ripgrep $RG_VERSION" | "ripgrep $RG_VERSION "*) ;;
            *) echo "::error::$rg_found is not ripgrep $RG_VERSION"; exit 1 ;;
          esac
          git config --global user.name corvint-ci
          git config --global user.email corvint-ci@users.noreply.github.com
          git config --global maintenance.auto false
          git config --global gc.auto 0
          git --version
      - name: Capture trusted tool source outside tested checkout
        continue-on-error: true
        if: github.event_name == 'pull_request' && env.CORVINT_PR_TOOL_SOURCE != ''
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: trusted-tools
          ref: ${{ env.CORVINT_PR_TOOL_SOURCE }}
          persist-credentials: false
      - name: Build pinned planner, selector, and driver
        continue-on-error: true
        if: github.event_name == 'pull_request' && env.CORVINT_PR_TOOL_SOURCE != ''
        working-directory: trusted-tools
        run: |
          test "$(git rev-parse HEAD)" = "$CORVINT_PR_TOOL_SOURCE"
          mkdir -p "$RUNNER_TEMP/corvint-pr-bin"
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/corvint-pr-bin/corvint" ./cmd/corvint
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/corvint-pr-bin/selector" ./tools/gate-affected-select
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/corvint-pr-bin/driver" ./tools/corvint-pr-tests
      - name: Capture the pinned shadow planner source outside tested checkout
        continue-on-error: true
        if: github.event_name == 'pull_request' && env.CORVINT_TEST_SHADOW_SOURCE != '' && needs.docs-plan.outputs.mode != 'DOCS' && needs.docs-plan.outputs.mode != 'REUSE'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: trusted-shadow
          ref: ${{ env.CORVINT_TEST_SHADOW_SOURCE }}
          persist-credentials: false
      - name: Build the pinned shadow planner
        # AFP-V0-047: only ./cmd/corvint, from the shadow pin, never from the tested checkout.
        continue-on-error: true
        if: github.event_name == 'pull_request' && env.CORVINT_TEST_SHADOW_SOURCE != '' && needs.docs-plan.outputs.mode != 'DOCS' && needs.docs-plan.outputs.mode != 'REUSE'
        working-directory: trusted-shadow
        run: |
          test "$(git rev-parse HEAD)" = "$CORVINT_TEST_SHADOW_SOURCE"
          mkdir -p "$RUNNER_TEMP/corvint-shadow-bin"
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/corvint-shadow-bin/corvint" ./cmd/corvint
      - name: Build protected partition helper independently of PR module directives
        working-directory: source
        run: |
          # .github is owner-protected by the control plane. Only these explicit files enter
          # the isolated module; tested go.mod/replace directives cannot redirect its import.
          d="$RUNNER_TEMP/ci-shards-source"
          mkdir -p "$d/cmd"
          cp .github/cishards/partition.go .github/cishards/partition_test.go .github/cishards/order.go .github/cishards/order_test.go .github/cishards/slices.go .github/cishards/slices_test.go .github/cishards/package-costs.json .github/cishards/test-split-allow.json .github/cishards/test-slices.json "$d/"
          cp .github/cishards/cmd/main.go "$d/cmd/"
          printf 'module github.com/Beamfall/corvint/.github/cishards\n\ngo 1.27.2\n' > "$d/go.mod"
          cd "$d"
          export GOENV=off GOWORK=off GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off GOFLAGS=
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/ci-shards" ./cmd
      - name: Build protected test read-scope wrapper independently of PR module directives
        working-directory: source
        run: |
          # AFP-V0-023: the `go test -exec` wrapper that confines each package declared in
          # .corvint/test-read-scopes.json with Landlock. Built like ci-shards, so tested
          # module directives cannot redirect it; a declaration without Landlock fails here.
          d="$RUNNER_TEMP/test-confine-source"
          mkdir -p "$d/cmd"
          cp .github/testconfine/scopes.go .github/testconfine/scopes_test.go .github/testconfine/landlock_linux.go .github/testconfine/landlock_linux_test.go .github/testconfine/landlock_other.go "$d/"
          cp .github/testconfine/cmd/main.go .github/testconfine/cmd/exec_unix.go .github/testconfine/cmd/exec_other.go "$d/cmd/"
          printf 'module github.com/Beamfall/corvint/.github/testconfine\n\ngo 1.27.2\n' > "$d/go.mod"
          declared=$([ -f .corvint/test-read-scopes.json ] && echo 1 || true)
          cd "$d"
          export GOENV=off GOWORK=off GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off GOFLAGS=
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/test-confine" ./cmd
          if [ -n "$declared" ]; then
            "$RUNNER_TEMP/test-confine" -probe
          fi
      - name: Fetch advisory affected-first order plan
        if: github.event_name == 'pull_request' && needs.docs-plan.outputs.mode != 'DOCS'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: affected-order
          path: ${{ runner.temp }}/affected-order
      - name: Report the plan's selected share of estimated suite time (advisory)
        # AFP-V0-025: a shadow metric only. The plan still orders, and never narrows, what runs.
        if: github.event_name == 'pull_request' && needs.docs-plan.outputs.mode != 'DOCS' && needs.docs-plan.outputs.mode != 'REUSE' && strategy.job-index == 0
        continue-on-error: true
        timeout-minutes: 2
        working-directory: source
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/affected-share"
          go list ./... | "$RUNNER_TEMP/ci-shards" --share "$RUNNER_TEMP/affected-order/plan.json" \
            > "$RUNNER_TEMP/affected-share/share.json.partial"
          mv "$RUNNER_TEMP/affected-share/share.json.partial" "$RUNNER_TEMP/affected-share/share.json"
          {
            echo '### Affected plan: selected share of estimated suite time (advisory)'
            jq -r '"\(.selectedPermille / 10)% selected: \(.selectedMilliseconds / 1000 | floor) s of \(.universeMilliseconds / 1000 | floor) s, \(.selectedPackages) of \(.universePackages) packages. Unbounded readers: \(.unboundedPackages) packages, \(.unboundedMilliseconds / 1000 | floor) s. Unpriced packages take the median: \(.unpricedPackages)."' \
              "$RUNNER_TEMP/affected-share/share.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain selected share
        if: github.event_name == 'pull_request' && needs.docs-plan.outputs.mode != 'DOCS' && needs.docs-plan.outputs.mode != 'REUSE' && strategy.job-index == 0
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: affected-share
          path: ${{ runner.temp }}/affected-share/share.json
          if-no-files-found: ignore
      - name: Shadow corvint test plan (never decides, executes or narrows)
        # STR-V0-012 rollout step 3 under AFP-V0-029 and AFP-V0-047: the corvint built above
        # from CORVINT_TEST_SHADOW_SOURCE, outside the tested checkout, plans this shard with the
        # ci profile and universe placement and prints its argv; --dry-run runs nothing but Git.
        # The Go tests step below keeps executing the full shard, and its result alone counts.
        # selection.json is this shard's retained S (corvint-pr-selection/0) for the forward rows.
        if: github.event_name == 'pull_request' && env.CORVINT_TEST_SHADOW_SOURCE != '' && needs.docs-plan.outputs.mode != 'DOCS' && needs.docs-plan.outputs.mode != 'REUSE'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: source
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TESTED_MERGE: ${{ github.sha }}
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          shadow="$RUNNER_TEMP/corvint-shadow-bin/corvint"
          test -x "$shadow"
          d="$RUNNER_TEMP/corvint-test-shadow"
          mkdir -p "$d"
          status=0
          "$shadow" --root "$PWD" test --base "$PR_BASE" --profile ci \
            --confine "$RUNNER_TEMP/test-confine" --placement universe --shard "$SHARD/$SHARDS" --dry-run \
            --manifest "$d/manifest.json" > "$d/dry-run.json" < /dev/null || status=$?
          echo "corvint test --dry-run, shard $SHARD of $SHARDS, exited $status (shadow only)"
          touch "$d/manifest.json"
          shadow_tree=$(git rev-parse --verify -q "$TESTED_MERGE^{tree}" || true)
          jq -n -c --slurpfile dry "$d/dry-run.json" --slurpfile manifest "$d/manifest.json" \
            --arg toolSource "$CORVINT_TEST_SHADOW_SOURCE" --arg toolDigest "sha256:$(sha256sum "$shadow" | cut -d' ' -f1)" \
            --arg pr "$PR_NUMBER" --arg head "$PR_HEAD" --arg base "$PR_BASE" --arg target "$TESTED_MERGE" \
            --arg tree "$shadow_tree" --arg runId "$GITHUB_RUN_ID" --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg shard "$SHARD" --arg shards "$SHARDS" --arg exit "$status" \
            -f .github/forward-rows/selection.jq > "$d/selection.json"
          jq -c '{scope, exit, selected: (.selected | length), manifestDigest, incomplete}' "$d/selection.json"
      - name: Retain corvint test shadow plan
        if: github.event_name == 'pull_request' && env.CORVINT_TEST_SHADOW_SOURCE != '' && needs.docs-plan.outputs.mode != 'DOCS' && needs.docs-plan.outputs.mode != 'REUSE'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corvint-test-shadow-${{ strategy.job-index }}
          path: ${{ runner.temp }}/corvint-test-shadow/
          if-no-files-found: ignore
          retention-days: 14
      - name: Narrowing gate (AFP-V0-098, off unless CORVINT_PR_NARROWING is on)
        # Runs the pinned tools' narrow.sh only after the trusted verdict said MET. It narrows
        # this shard only when the deciding driver's selection (--mode plan) is a superset of the
        # whole-universe shadow `corvint test --dry-run` selection of the same (base, head), the
        # change touches no .github/ path and main keeps its merge queue; otherwise it records
        # FULL and why. The tests step below runs the same argv, env and confine wrapper either
        # way (AFP-V0-028); a narrowed shard names no tested tree, so its merge-queue entry runs
        # full (AFP-V0-099).
        id: narrow
        if: github.event_name == 'pull_request' && vars.CORVINT_PR_NARROWING == 'on' && needs.narrowing-verdict.outputs.verdict == 'MET' && github.event.pull_request.head.repo.full_name == github.repository && env.CORVINT_PR_TOOL_SOURCE != '' && env.CORVINT_TEST_SHADOW_SOURCE != '' && needs.docs-plan.outputs.mode != 'DOCS' && needs.docs-plan.outputs.mode != 'REUSE'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TESTED_MERGE: ${{ github.sha }}
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
          TOOL_SOURCE: ${{ env.CORVINT_PR_TOOL_SOURCE }}
          VERDICT_RUN: ${{ needs.narrowing-verdict.outputs.verdictRun }}
        run: |
          test -f "$GITHUB_WORKSPACE/trusted-tools/.github/forward-rows/narrow.sh"
          PR_BIN="$RUNNER_TEMP/corvint-pr-bin" SHADOW="$RUNNER_TEMP/corvint-shadow-bin/corvint" \
            CI_SHARDS="$RUNNER_TEMP/ci-shards" CONFINE="$RUNNER_TEMP/test-confine" \
            sh "$GITHUB_WORKSPACE/trusted-tools/.github/forward-rows/narrow.sh"
      - name: Retain the narrowing record (AFP-V0-099)
        # The record must reach the forward rows before the shard may skip a package: the tests
        # step narrows only when this upload succeeded.
        id: narrow-record
        if: steps.narrow.outputs.mode == 'NARROWED' || steps.narrow.outputs.mode == 'FULL'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-narrowing-${{ strategy.job-index }}
          path: ${{ runner.temp }}/corvint-narrowing/narrowing.json
          if-no-files-found: error
          retention-days: 90
      - name: Go tests (full until matching shadow qualification)
        id: tests
        # DOCS (DCI-V0) and REUSE (AFP-V0-024) are the only modes that omit this invocation.
        if: needs.docs-plan.result != 'success' || (needs.docs-plan.outputs.mode != 'DOCS' && needs.docs-plan.outputs.mode != 'REUSE')
        working-directory: source
        env:
          TESTED_MERGE: ${{ github.sha }}
          SHARD: ${{ strategy.job-index }}
          SHARDS: ${{ strategy.job-total }}
          # AFP-V0-098: set only when the narrowing gate ran; NARROWED narrows this shard only
          # when its record was retained (AFP-V0-099). Anything else runs the whole shard.
          NARROW_MODE: ${{ steps.narrow.outputs.mode }}
          NARROW_RECORDED: ${{ steps.narrow-record.outcome }}
        run: |
          test "$(go env GOVERSION)" = "go1.27.2"
          # AFP-V0-097/098: the only route to a narrowed shard is the gate above. A skipped, refused
          # or failed verdict or gate leaves NARROW_MODE other than NARROWED and runs the whole shard
          # here; the deciding driver never executes tests (its historical profile is evidence only).
          echo "Go tests: shard $SHARD of $SHARDS, whole unless the AFP-V0-098 gate narrowed it"
          go list ./... > "$RUNNER_TEMP/ci-package-universe"
          # The same shard as without --order; a readable plan only moves its selected
          # packages to the front, so a failure in a changed package surfaces early.
          packages=$("$RUNNER_TEMP/ci-shards" --shard "$SHARD" --shards "$SHARDS" --order "$RUNNER_TEMP/affected-order/plan.json" < "$RUNNER_TEMP/ci-package-universe")
          # AFP-V0-041 (decision 0488): this shard's test slices of split packages, one
          # "FLAG PATTERN PACKAGE" invocation per line; a split package is never whole.
          slices=$("$RUNNER_TEMP/ci-shards" --shard "$SHARD" --shards "$SHARDS" --slices < "$RUNNER_TEMP/ci-package-universe")
          # AFP-V0-098: a narrowed shard keeps only the packages and slices its retained record
          # names in `executed`, in the same order, argv, env and confine wrapper. The record must
          # be a readable NARROWED corvint-pr-narrowing/0 document whose `executed` list equals the
          # `executed` sidecar line for line, and the filtered set must equal it; a missing,
          # unreadable or disagreeing record or sidecar runs the whole shard. Only a record whose
          # `executed` is empty (an AFP-V0-028 empty intersection) runs no Go test.
          narrowed=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$NARROW_MODE" = NARROWED ] && [ "$NARROW_RECORDED" = success ]; then
            record="$RUNNER_TEMP/corvint-narrowing/narrowing.json"
            keep="$RUNNER_TEMP/corvint-narrowing/executed"
            if recorded=$(jq -er 'select(.profile == "corvint-pr-narrowing/0" and .mode == "NARROWED" and (.executed | type) == "array"
                  and all(.executed[]; type == "string" and length > 0 and (test("\\s") | not))) | .executed | join("\n")' "$record" 2> /dev/null) &&
              [ -f "$keep" ] && [ -r "$keep" ] && listed=$(cat "$keep") && [ "$recorded" = "$listed" ]; then
              # shellcheck disable=SC2086
              kept_packages=$(printf '%s\n' $packages | sed '/^$/d' | grep -Fxf "$keep" || true)
              kept_slices=$(printf '%s\n' "$slices" | sed '/^$/d' | awk 'NR == FNR { keep[$0] = 1; next } ($3 in keep)' "$keep" - || true)
              if [ "$( { printf '%s\n' "$kept_packages"; awk '{ print $3 }' <<< "$kept_slices"; } | sed '/^$/d' | sort -u)" = "$(printf '%s\n' "$recorded" | sed '/^$/d' | sort -u)" ]; then
                narrowed=1
                echo "AFP-V0-098: shard $SHARD narrowed to $(printf '%s\n' "$recorded" | sed '/^$/d' | wc -l) package(s); the full suite runs in the merge queue"
                packages=$kept_packages
                slices=$kept_slices
              else
                echo "::warning::shard $SHARD: the narrowed set disagrees with its record; running the whole shard"
              fi
            else
              echo "::warning::shard $SHARD: the narrowing record or its executed list is missing, unreadable or disagrees; running the whole shard"
            fi
          fi
          if [ -z "$packages" ] && [ -z "$slices" ]; then
            echo "Complete-universe shard $SHARD has no packages."
            exit 0
          fi
          # The protected helper validates each package as a typed, non-option word and
          # each slice pattern as one anchored element of plain test names.
          # Declared packages run confined to their read scopes (AFP-V0-023).
          # AFP-V0-047: a pull-request or merge-queue shard retains package outcomes for the
          # forward rows; `expected` names each invocation's package, `whole` the packages
          # the rerun may name, and run_tests appends each failed slice to `failed-slices`.
          # Every setup command sits in the `if` condition, so a failed write leaves the
          # outcomes off and never changes this step's status.
          outcomes_dir=""
          case "$GITHUB_EVENT_NAME" in
            pull_request | merge_group)
              d="$RUNNER_TEMP/forward-outcomes"
              # shellcheck disable=SC2086
              if mkdir -p "$d" 2> /dev/null &&
                printf '%s\n' $packages | sed '/^$/d' > "$d/whole" 2> /dev/null &&
                { cat "$d/whole" && { [ -z "$slices" ] || awk '{ print $3 }' <<< "$slices"; }; } > "$d/expected" 2> /dev/null &&
                : > "$d/failed-slices" 2> /dev/null; then
                outcomes_dir="$d"
              else
                echo "::warning::shard $SHARD: forward-row outcomes are off (setup failed)"
              fi
              ;;
          esac
          run_tests() {
            # AFP-V0-041: every invocation runs, whole packages first and then each slice;
            # any failed invocation fails the shard.
            local failed=0
            if [ -n "$packages" ]; then
              # shellcheck disable=SC2086
              CORVINT_CONFINE_ROOT="$PWD" go test -exec "$RUNNER_TEMP/test-confine" -json -p 1 -count=1 -race -timeout 50m $packages < /dev/null || failed=1
            fi
            if [ -n "$slices" ]; then
              while read -r flag pattern pkg; do
                CORVINT_CONFINE_ROOT="$PWD" go test -exec "$RUNNER_TEMP/test-confine" -json -p 1 -count=1 -race -timeout 50m "$flag" "$pattern" "$pkg" < /dev/null || {
                  failed=1
                  [ -z "$outcomes_dir" ] || echo "$flag $pattern $pkg" >> "$outcomes_dir/failed-slices" || true
                }
              done <<< "$slices"
            fi
            return "$failed"
          }
          # AFP-V0-047: derive this shard's outcomes, then rerun each failed whole package and
          # failed slice once (at most 8, else SKIPPED_BOUND) and keep the rerun outcomes beside
          # the first. The rerun never changes the step's status: a failed shard still fails.
          forward_outcomes() {
            OUTCOMES_TREE=$(git rev-parse --verify -q "$TESTED_MERGE^{tree}" || true)
            export OUTCOMES_TREE
            sh .github/forward-rows/outcomes.sh first "$outcomes_dir" "$1" "$capture" || return 1
            [ -s "$outcomes_dir/rerun-lines" ] || return 0
            echo "AFP-V0-047: rerunning $(wc -l < "$outcomes_dir/rerun-lines") failed invocation(s) once; this shard still fails"
            while read -r -a argv; do
              CORVINT_CONFINE_ROOT="$PWD" go test -exec "$RUNNER_TEMP/test-confine" -json -p 1 -count=1 -race -timeout 50m "${argv[@]}" < /dev/null || true
            done < "$outcomes_dir/rerun-lines" > "$outcomes_dir/rerun.stream"
            sh .github/forward-rows/outcomes.sh rerun "$outcomes_dir" "$outcomes_dir/rerun.stream"
          }
          # AFP-V0-040: best-effort capture of the JSON stream for the advisory cost-drift
          # report. Only go test's own status decides this step: a capture file that cannot
          # be created runs the tests uncaptured, and tee's status is never consulted.
          capture="$RUNNER_TEMP/shard-costs/shard-$SHARD.json"
          if mkdir -p "$RUNNER_TEMP/shard-costs" 2> /dev/null && : 2> /dev/null > "$capture"; then
            set +e
            run_tests | tee "$capture"
            status=${PIPESTATUS[0]}
            set -e
            if [ -n "$outcomes_dir" ]; then
              forward_outcomes "$status" || echo "::warning::shard $SHARD: forward-row outcomes incomplete"
            fi
            [ "$status" = 0 ] || exit "$status"
            [ -n "$narrowed" ] || echo "costs=1" >> "$GITHUB_OUTPUT" || true
          else
            echo "::notice::shard $SHARD: package outcomes not captured; the cost-drift report will abstain"
            run_tests
          fi
          # AFP-V0-024/170: a shard names no tested tree; the ci-tested-tree-record job does,
          # after every shard passed in full. A narrowed shard (AFP-V0-099) stops that job.
          if [ -n "$narrowed" ]; then
            echo "AFP-V0-098: selected packages passed; the full suite runs in the merge queue"
          fi
      - name: Retain package outcomes for the advisory cost-drift report
        # AFP-V0-040: only a complete full shard whose tests passed keeps its outcomes.
        if: steps.tests.outputs.costs == '1'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-shard-costs-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shard-costs/shard-${{ strategy.job-index }}.json
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true
      - name: Retain package outcomes for the forward rows
        # AFP-V0-047: the shard's corvint-ci-outcomes/0 document, also after a failed or
        # interrupted shard; the ci-control-plane forward-rows job reads it.
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-outcomes-${{ github.event_name }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/forward-outcomes/outcomes.json
          if-no-files-found: ignore
          overwrite: true
      - name: Expire cached test results before saving the build cache
        # Only a main push whose full race invocation passed writes the cache. A REUSE or DOCS
        # push (AFP-V0-024, including a push that reuses its queue run) compiles nothing, skips
        # the tests step, and saving it would make the newest entry an empty one.
        id: testcache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gocache.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        working-directory: source
        run: |
          test "$(go env GOCACHE)" = "$HOME/.cache/go-build"
          go clean -testcache
      - name: Save the trusted Go build cache (main pushes only)
        if: steps.testcache.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  ci-tested-tree-record:
    # AFP-V0-170 (V1-2271): the only evidence the AFP-V0-024/046 reuse decision accepts. In a
    # pull-request or merge-queue run, after every go-product shard passed with its complete
    # package set (not DOCS, not REUSE, and no shard narrowed, which needs a MET verdict), it
    # prints the tested tree, the tested commit, its second parent and the shard count as one
    # fixed line to this job's own log. It runs no repository code (checkout, git and printf
    # only) and persists no credentials, so no test, build step or fork pull request in another
    # job can write that log. Only ci.yml, which the ci-control-plane admin review gates and
    # which is part of the tree a reusing commit must equal, changes what it prints. Any
    # mismatch prints no record, and the reusing run runs FULL; this job never fails CI.
    needs: [docs-plan, narrowing-verdict, go-product-shard]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.go-product-shard.result == 'success' && needs.narrowing-verdict.outputs.verdict != 'MET' && (needs.docs-plan.result != 'success' || (needs.docs-plan.outputs.mode != 'DOCS' && needs.docs-plan.outputs.mode != 'REUSE')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Must equal the go-product-shard matrix length and REUSE_SHARDS.
      SHARDS: "8"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Record the tested tree
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if ! head=$(git rev-parse --verify -q "$GITHUB_SHA^2") || git rev-parse --verify -q "$GITHUB_SHA^3" > /dev/null; then
            echo 'AFP-V0-170: the tested commit is not a two-parent merge; no tree is recorded.'
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$head" != "$PR_HEAD" ]; then
            echo 'AFP-V0-170: the tested merge does not name the pull-request head; no tree is recorded.'
            exit 0
          fi
          tree=$(git rev-parse --verify -q "$GITHUB_SHA^{tree}")
          printf 'corvint-ci-tested-tree/1 tree=%s target=%s head=%s shards=%s\n' "$tree" "$GITHUB_SHA" "$head" "$SHARDS"

  static-reuse:
    # AFP-V0-080 (V1-1642): a main push whose own commit already passed go-static,
    # artifact-integrity and go-interop in a successful merge-queue run of this workflow skips
    # those three jobs. The queue run tested this exact commit, so the same tree, ci.yml and
    # Makefile. Only listings are read (public, as in the docs-plan reuse step); nothing is
    # checked out or downloaded. Any failure, refusal or unreadable listing leaves `mode` empty,
    # and the three jobs then run in full. It never runs for a pull request or queue entry.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.find.outputs.mode }}
    steps:
      - name: Find a passed merge-queue run of this exact commit
        id: find
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions"
          get() {
            curl -fsS --max-time 30 --max-filesize 4194304 -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" -o "$2" "$1" ||
              curl -fsS --max-time 30 --max-filesize 4194304 -H 'Accept: application/vnd.github+json' -o "$2" "$1"
          }
          d="$RUNNER_TEMP/static-reuse"
          mkdir -p "$d"
          get "$api/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=merge_group&status=success&per_page=20" "$d/runs.json"
          ids=$(jq -r --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '.workflow_runs[]?
            | select(.head_sha == $sha and .event == "merge_group" and .conclusion == "success"
              and .path == ".github/workflows/ci.yml" and .head_repository.full_name == $repo
              and (.head_branch | startswith("gh-readonly-queue/main/")) and (.id | type == "number"))
            | .id' "$d/runs.json" | head -n 5)
          for id in $ids; do
            get "$api/runs/$id/jobs?filter=latest&per_page=100" "$d/jobs-$id.json" || continue
            # Exactly one latest job of each name, every one success on this commit.
            if jq -e --arg sha "$GITHUB_SHA" '[.jobs[]? | select(.name == "go-static" or .name == "artifact-integrity" or .name == "go-interop")]
              | length == 3 and (map(.name) | unique | length == 3)
                and all(.conclusion == "success" and .head_sha == $sha)' "$d/jobs-$id.json" > /dev/null; then
              echo "Static reuse (AFP-V0-080): go-static, artifact-integrity and go-interop passed on $GITHUB_SHA in merge-queue run $id; not rerun." >> "$GITHUB_STEP_SUMMARY"
              echo 'mode=REUSE' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Static reuse (AFP-V0-080): no successful merge-queue run passed all three jobs on $GITHUB_SHA; they run in full." >> "$GITHUB_STEP_SUMMARY"

  go-static:
    # V1-1093: the static, formatting, build, protected-helper and interop checks that shard 0
    # ran serially after its race tests. They need no docs-plan output, so they start at once,
    # beside the shards, on every path that starts the shards (FULL, DOCS and REUSE alike).
    # AFP-V0-013 keeps them full; go-product needs this job, so its required coverage is
    # unchanged. Like the shards, a ci:batched constituent (AFP-V0-027) never starts it, and a
    # main push whose queue run passed it on the same commit reuses that result (AFP-V0-080).
    needs: static-reuse
    if: ${{ !cancelled() && !contains(github.event.pull_request.labels.*.name, 'ci:batched') && needs.static-reuse.outputs.mode != 'REUSE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
      GOWORK: "off"
      GOFLAGS: ""
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: source
          ref: ${{ github.sha }}
          # Depth 2 keeps the pull-request merge commit's base parent for the AFP-V0-042 diff.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: "1.27.2"
      - name: Full static, formatting and build checks
        working-directory: source
        run: |
          test -z "$(gofmt -l cmd internal tools .github/cishards .github/testconfine)"
          go vet ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
      - name: Windows vet including test files (AFP-V0-042)
        # go build skips _test.go files, so a test that breaks only for GOOS=windows reached main
        # (V1-1117). Skipped only on a pull request whose merge commit provably changes no .go,
        # go.mod or go.sum file against its base; any doubt runs the vet.
        working-directory: source
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -n "$PR_BASE" ] &&
            [ "$(git rev-parse -q --verify 'HEAD^1' || true)" = "$PR_BASE" ] &&
            git diff --quiet "$PR_BASE" HEAD -- '*.go' '*go.mod' '*go.sum'; then
            echo 'Windows vet skipped: no .go, go.mod or go.sum file changed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet ./...
          (cd interop/cem01-go && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go vet ./...)
      - name: Protected helper self-tests independently of PR module directives
        working-directory: source
        run: |
          # The same isolated modules go-product-shard builds its helpers from, so tested
          # go.mod/replace directives cannot redirect what these tests exercise.
          export GOENV=off GOWORK=off GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off GOFLAGS=
          d="$RUNNER_TEMP/ci-shards-source"
          mkdir -p "$d/cmd"
          cp .github/cishards/partition.go .github/cishards/partition_test.go .github/cishards/order.go .github/cishards/order_test.go .github/cishards/slices.go .github/cishards/slices_test.go .github/cishards/package-costs.json .github/cishards/test-split-allow.json .github/cishards/test-slices.json "$d/"
          cp .github/cishards/cmd/main.go "$d/cmd/"
          printf 'module github.com/Beamfall/corvint/.github/cishards\n\ngo 1.27.2\n' > "$d/go.mod"
          t="$RUNNER_TEMP/test-confine-source"
          mkdir -p "$t/cmd"
          cp .github/testconfine/scopes.go .github/testconfine/scopes_test.go .github/testconfine/landlock_linux.go .github/testconfine/landlock_linux_test.go .github/testconfine/landlock_other.go "$t/"
          cp .github/testconfine/cmd/main.go .github/testconfine/cmd/exec_unix.go .github/testconfine/cmd/exec_other.go "$t/cmd/"
          printf 'module github.com/Beamfall/corvint/.github/testconfine\n\ngo 1.27.2\n' > "$t/go.mod"
          for m in "$d" "$t"; do
            (
              cd "$m"
              go test -race -count=1 -timeout 30m ./...
              go vet ./...
              CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
            )
          done
      - name: Independent interop under production toolchain
        working-directory: source/interop/cem01-go
        run: |
          go test -count=1 -timeout 30m ./...
          go vet ./...

  go-product:
    # The required check. A needed job that fails, is cancelled or is skipped is not success.
    if: always()
    needs: [go-product-shard, go-static, docs-plan, static-reuse]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every go-product shard and the static job succeeded
        env:
          SHARDS_RESULT: ${{ needs.go-product-shard.result }}
          STATIC_RESULT: ${{ needs.go-static.result }}
          STATIC_REUSE: ${{ needs.static-reuse.outputs.mode }}
          DOCS_RESULT: ${{ needs.docs-plan.result }}
        run: |
          if [ "$SHARDS_RESULT" = skipped ]; then
            echo '::error::go-product shards did not run: this pull request is labelled ci:batched. Merge it through its batch pull request, or remove the label and push (or close and reopen) to test it alone.'
          fi
          test "$SHARDS_RESULT" = success
          # AFP-V0-080: only a main push whose queue run passed go-static on this commit skips it.
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$STATIC_REUSE" = REUSE ] && [ "$STATIC_RESULT" = skipped ]; then
            echo 'go-static reused from the merge-queue run of this commit (AFP-V0-080).'
          else
            test "$STATIC_RESULT" = success
          fi
          test "$DOCS_RESULT" = success

  ci-shard-cost-drift:
    # AFP-V0-040: advisory drift report for .github/cishards/package-costs.json from this run's
    # shard outcomes. It is not a required check: it never fails on a finding, never changes
    # shard membership or placement, posts no commit status and never writes the table.
    # Refreshing the table stays an operator step (AFP-V0-022). Anything but every shard's
    # outcomes abstains with its reason. A ci:batched constituent has no shard outcomes (AFP-V0-081).
    if: ${{ always() && !cancelled() && !contains(github.event.pull_request.labels.*.name, 'ci:batched') }}
    needs: go-product-shard
    runs-on: ubuntu-24.04
    # Every step is continue-on-error and their timeouts sum below this one, so no failure,
    # timeout or abstention ends the job red.
    continue-on-error: true
    timeout-minutes: 20
    env:
      # Must equal the go-product-shard matrix, or every run abstains.
      SHARDS: "8"
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
      GOWORK: "off"
      GOFLAGS: ""
    steps:
      - name: Fetch shard package outcomes
        if: needs.go-product-shard.result == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ci-shard-costs-*
          merge-multiple: true
          path: ${{ runner.temp }}/shard-costs
      - name: Require the outcomes of every shard
        id: complete
        continue-on-error: true
        timeout-minutes: 1
        env:
          SHARDS_RESULT: ${{ needs.go-product-shard.result }}
        run: |
          d="$RUNNER_TEMP/shard-costs"
          have=$(find "$d" -maxdepth 1 -name 'shard-*.json' -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$SHARDS_RESULT" != success ]; then
            reason="go-product-shard result is $SHARDS_RESULT"
          elif [ "$have" -ne "$SHARDS" ]; then
            reason="$have of $SHARDS shard outcome artifacts present (a docs-only, reused or selected run executes no complete shard)"
          else
            echo 'ok=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '### CI shard cost table drift (advisory, AFP-V0-040)\n\nAbstained: %s; a partial run cannot measure the table.\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          echo 'summarized=1' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        id: checkout
        if: steps.complete.outputs.ok == '1'
        continue-on-error: true
        timeout-minutes: 3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: setup-go
        if: steps.complete.outputs.ok == '1' && steps.checkout.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        with:
          cache: false
          go-version: "1.27.2"
      - name: Report cost drift (advisory; findings never fail)
        id: report
        if: steps.complete.outputs.ok == '1' && steps.setup-go.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if ! go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/ci-shard-costs" ./tools/ci-shard-costs; then
            printf '### CI shard cost table drift (advisory, AFP-V0-040)\n\nAbstained: tools/ci-shard-costs did not build. No finding is reported for this run.\n' >> "$GITHUB_STEP_SUMMARY"
            echo 'summarized=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=0
          "$RUNNER_TEMP/ci-shard-costs" check --advisory --shards "$SHARDS" --summary "$GITHUB_STEP_SUMMARY" \
            "$RUNNER_TEMP"/shard-costs/shard-*.json || code=$?
          echo "ci-shard-costs check --advisory exited $code (2 means it abstained; see the job summary)"
          # 0 reports and 2 abstains, each into the summary; any other exit leaves it to the fallback.
          if [ "$code" = 0 ] || [ "$code" = 2 ]; then
            echo 'summarized=1' >> "$GITHUB_OUTPUT"
          fi
      - name: Record why no drift report was written
        if: always() && steps.complete.outputs.summarized != '1' && steps.report.outputs.summarized != '1'
        continue-on-error: true
        timeout-minutes: 1
        env:
          COMPLETE: ${{ steps.complete.outcome }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_GO: ${{ steps.setup-go.outcome }}
          REPORT: ${{ steps.report.outcome }}
        run: |
          if [ "$COMPLETE" != success ]; then
            reason="the shard outcome check ended $COMPLETE"
          elif [ "$CHECKOUT" != success ]; then
            reason="checkout ended $CHECKOUT"
          elif [ "$SETUP_GO" != success ]; then
            reason="setup-go ended $SETUP_GO"
          else
            reason="the report step ended $REPORT without a report"
          fi
          printf '### CI shard cost table drift (advisory, AFP-V0-040)\n\nAbstained: %s. No finding is reported for this run.\n' "$reason" >> "$GITHUB_STEP_SUMMARY"

  go-interop:
    # Not a required check. AFP-V0-081: a ci:batched constituent never starts it (its batch pull
    # request and queue entry run it on the combined tree); AFP-V0-080: a main push reuses the
    # passed merge-queue run of the same commit.
    needs: static-reuse
    if: ${{ !cancelled() && !contains(github.event.pull_request.labels.*.name, 'ci:batched') && needs.static-reuse.outputs.mode != 'REUSE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: "1.27.2"
      - name: Go gate
        working-directory: interop/cem01-go
        env:
          GOFLAGS: ""
          GOPROXY: "off"
          GOTOOLCHAIN: local
          GOWORK: "off"
        run: |
          test -z "$(gofmt -l .)"
          go test -count=1 ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go build ./...

  artifact-integrity:
    # Not a required check; skipped as go-interop is (AFP-V0-080, AFP-V0-081).
    needs: static-reuse
    if: ${{ !cancelled() && !contains(github.event.pull_request.labels.*.name, 'ci:batched') && needs.static-reuse.outputs.mode != 'REUSE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: "1.27.2"
      - name: Verify native Go archives
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          GOWORK: "off"
        run: make go-archive-gate
