# SPDX-License-Identifier: Apache-2.0
name: Merge queue cleanup

# CIN-V0-5018 (V1-5017): cancel only entries whose exact queue branch is gone.
# A base-wide concurrency group could cancel a different, still-live entry.
# Run from the default branch, without checking out or executing candidate code.
on:
  push:
    branches: [main]
  delete:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

concurrency:
  group: merge-queue-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cancel-stale:
    if: github.event_name != 'delete' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'gh-readonly-queue/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel runs for deleted queue refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          for workflow in ci.yml cem-release-gate.yml; do
            for status in queued in_progress; do
              # Read every page; an API or schema error cannot establish absence.
              gh api --paginate "repos/$REPO/actions/workflows/$workflow/runs?event=merge_group&status=$status&per_page=100" > "$work/runs"
              jq -es 'all(.[]; (.workflow_runs | type) == "array")' "$work/runs" > /dev/null
              jq -sr '[.[].workflow_runs[] | select(.event == "merge_group") | .id | select(type == "number")] | unique[]' "$work/runs" > "$work/ids"
              while IFS= read -r id; do
                # Re-read the run: it may have completed since the listing.
                if ! gh api "repos/$REPO/actions/runs/$id" > "$work/run"; then
                  echo "::warning::Cannot read run $id; leaving it alone."
                  continue
                fi
                if ! jq -e --argjson id "$id" --arg path ".github/workflows/$workflow" '
                  .id == $id and .path == $path and .event == "merge_group" and
                  (.status == "queued" or .status == "in_progress") and
                  (.head_branch | type == "string" and startswith("gh-readonly-queue/"))
                ' "$work/run" > /dev/null; then
                  continue
                fi
                ref=$(jq -r '"refs/heads/" + .head_branch' "$work/run")
                encoded=$(jq -rn --arg ref "${ref#refs/}" '$ref | @uri')
                # matching-refs returns 200 + [] for absence, unlike an ambiguous
                # 404 (which may mean lost authorization). Prefix matches are not
                # exact matches; a newer branch must not protect a stale entry.
                if ! gh api "repos/$REPO/git/matching-refs/$encoded" > "$work/refs"; then
                  echo "::warning::Cannot check $ref; leaving run $id alone."
                  continue
                fi
                if ! jq -e --arg ref "$ref" '
                  type == "array" and all(.[]; (.ref | type) == "string") and
                  all(.[]; .ref != $ref)
                ' "$work/refs" > /dev/null; then
                  continue
                fi
                gh api --method POST "repos/$REPO/actions/runs/$id/cancel"
                echo "Cancelled stale merge-group run $id: $ref is absent." >> "$GITHUB_STEP_SUMMARY"
              done < "$work/ids"
            done
          done
