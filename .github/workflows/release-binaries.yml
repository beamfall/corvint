name: Release binaries

# The one tag pipeline of G15a (decision 0596): GHA-V1-040 to GHA-V1-042
# (docs/specs/openspec/changes/github-action/specs/github-action/spec.md) and ARTIFACT-BIN-V0-005,
# -006, -523, -525 and -526 (docs/specs/release-artifact-integrity-v0.md); V1-5236, V1-5237, V1-5473.
#
# A pushed version tag starts it: `vX.Y.Z` releases every product binary, `SET/vX.Y.Z` the members
# of one version set and `NAME/vX.Y.Z` one product binary (`release-binary select`). The `test` job
# runs the full Go test and vet commands of both modules at the tagged commit. The `build` job then
# runs `release-binary release --tag`, which builds only the binaries the tag selects, for the
# catalog's targets (linux/amd64, linux/arm64, darwin/arm64), with the catalog's licence files in
# every archive, merges the release manifest, rechecks the output and writes one `SHA256SUMS` of
# every archive (ARTIFACT-BIN-V0-525). When the tag builds corvint, the job first runs the corvint
# archive gate at the same commit, and `release --core-gate` requires the gate's corvint archives
# to equal its own byte for byte and carries the gate's `verification-report.json` into the
# output, the Core qualification `corvint-update apply --component core` binds each corvint
# archive to before it installs the core set (ARTIFACT-BIN-V0-526, UPD-V0-920). The job then
# smoke-tests an installed core set when the tag built corvint and corvint-docs
# (ARTIFACT-BIN-V0-509), and uploads the output as one artifact. The run then stops.
#
# Only `publish` holds `contents: write`, and it starts only after the owner approves the protected
# `release` environment (GHA-V1-041). It checks out nothing and runs no repository code: it
# rechecks the artifact's checksums, refuses unless the remote tag still names the tested commit,
# and creates the GitHub release of the tag from those files, unchanged. release-binary itself
# tags, signs and publishes nothing (ARTIFACT-BIN-V0-006).
#
# Publishing is off by default: `publish` runs only while the repository variable
# RELEASE_PUBLISH_ENABLED is `true`. Until then a tag runs `test` and `build` and stops. A job
# that names an environment the repository does not have gets a new, unprotected one, so the owner
# sets the variable only after configuring `release` with a required reviewer and protecting
# version tags (GHA-V1-042, repository settings this workflow cannot verify). The owner must not
# set it before the build attestation of GHA-V1-040 lands: that is NOT_PRODUCED here, because
# which job attests is open (D17) and this repository holds no reviewed SHA pin of an attestation
# action; adding it adds `id-token: write` (and `attestations: write` if GitHub requires it) to
# that one job. The manifest is merged without `--base`, so a SET or NAME tag's manifest records
# only the binaries that tag built.

on:
  push:
    tags:
      - "v*"
      - "*/v*"

# One run per tag; a release run is never cancelled by another.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  GOPROXY: "off"
  GOSUMDB: "off"
  GOWORK: "off"
  GOFLAGS: ""
  TAG: ${{ github.ref_name }}
  SHA: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CGO_ENABLED: "1"
    steps:
      - &check-tag
        name: Check the tag
        # release-binary select is the authority on the tag's scope; this refuses early a ref that
        # is not a tag or not of the three forms.
        run: |
          test "$GITHUB_REF_TYPE" = tag || { echo "::error::$GITHUB_REF is not a tag"; exit 2; }
          printf '%s\n' "$TAG" | grep -Eqx '([0-9A-Za-z._-]+/)?v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' ||
            { echo "::error::$TAG is not vX.Y.Z, SET/vX.Y.Z or NAME/vX.Y.Z"; exit 2; }
      - &checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          # release-binary stamps the first-parent commit count (ARTIFACT-BIN-V0-002).
          fetch-depth: 0
          persist-credentials: false
      - &verify-checkout
        name: Verify the checkout is the tagged commit
        run: test "$(git rev-parse HEAD)" = "$SHA"
      - &setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version: "1.27.4"
      - &provision
        name: Provision the host tools the product's fixed PATH resolves
        # The Linux half of release-gates.yml's provision step: the checksum-pinned ripgrep release
        # binary CI tests with, and go1.27.4 first on the fixed PATH.
        env:
          RG_VERSION: "15.2.0"
          RG_SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
        run: |
          sudo rm -rf /usr/local/go
          sudo ln -s "$(go env GOROOT)" /usr/local/go
          test "$(/usr/local/go/bin/go env GOVERSION)" = "go1.27.4"
          rg_name="ripgrep-$RG_VERSION-x86_64-unknown-linux-musl"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 --max-time 120 -o "$RUNNER_TEMP/$rg_name.tar.gz" \
            "https://github.com/BurntSushi/ripgrep/releases/download/$RG_VERSION/$rg_name.tar.gz"
          echo "$RG_SHA256  $RUNNER_TEMP/$rg_name.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$rg_name.tar.gz" -C "$RUNNER_TEMP" "$rg_name/rg"
          sudo install -m 0755 "$RUNNER_TEMP/$rg_name/rg" /usr/local/bin/rg
          test "$(PATH=/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin command -v rg)" = /usr/local/bin/rg
          git config --global user.name corvint-ci
          git config --global user.email corvint-ci@users.noreply.github.com
          git config --global maintenance.auto false
          git config --global gc.auto 0
      - name: Test and vet both modules (GHA-V1-040)
        # The AGENTS.md "Verify" commands, at the tagged commit.
        run: |
          test "$(go env GOVERSION)" = "go1.27.4"
          go test -count=1 -timeout 30m ./...
          go vet ./...
          (cd interop/cem01-go && go test -count=1 -timeout 30m ./... && go vet ./...)

  build:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - *check-tag
      - *checkout
      - *verify-checkout
      - *setup-go
      # The gate's host smoke runs the built corvint, which resolves the same host tools.
      - *provision
      - name: Run the corvint archive gate when the tag builds corvint (ARTIFACT-BIN-V0-526)
        # Runbook step 5: two cold builds per target, byte-identical, and the verification report
        # corvint-update reads. Its parent must be a real 0700 directory.
        run: |
          go run ./tools/release-binary select --tag "$TAG" | tee "$RUNNER_TEMP/selection.json"
          if ! grep -q '"corvint"' "$RUNNER_TEMP/selection.json"; then
            echo "::notice::$TAG does not build corvint; the archive gate does not apply"
            exit 0
          fi
          mkdir -m 0700 "$RUNNER_TEMP/gate"
          go run ./conformance/release-artifact-v0 archive --revision "$SHA" --output "$RUNNER_TEMP/gate/core"
          (cd "$RUNNER_TEMP/gate/core" && sha256sum --check --strict SHA256SUMS)
      - name: Build, checksum and recheck the tag's binaries (ARTIFACT-BIN-V0-523, -525)
        # The output directory is outside the checkout (ARTIFACT-BIN-V0-007); the run record goes
        # beside the outputs only after release has rechecked them. release writes SHA256SUMS and,
        # with --core-gate, the bound verification-report.json.
        run: |
          out="$RUNNER_TEMP/release"
          gate=()
          if [ -d "$RUNNER_TEMP/gate/core" ]; then
            gate=(--core-gate "$RUNNER_TEMP/gate/core")
          fi
          go run ./tools/release-binary release --tag "$TAG" --output "$out" "${gate[@]}" > "$RUNNER_TEMP/release-run.json"
          cat "$RUNNER_TEMP/release-run.json"
          cd "$out"
          sha256sum --check --strict SHA256SUMS release-manifest.json.sha256
          mv "$RUNNER_TEMP/release-run.json" release-run.json
          ls -l
      - name: Smoke an installed core set (V1-5237, V1-5473, ARTIFACT-BIN-V0-509)
        # The runner is linux/amd64. PATH holds git alone, so corvint can find corvint-docs only
        # beside itself, as on a hand install (docs/INSTALL.md). Each MCP server the tag built is
        # installed beside them and must report corvint's version.
        run: |
          out="$RUNNER_TEMP/release"
          if [ ! -f "$out/corvint_linux_amd64.tar.gz" ] || [ ! -f "$out/corvint-docs_linux_amd64.tar.gz" ]; then
            echo "::notice::$TAG did not build both corvint and corvint-docs; the installed-set smoke does not apply"
            exit 0
          fi
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke/set" "$smoke/path" "$smoke/home" "$smoke/extract"
          for name in corvint corvint-docs; do
            tar -xzf "$out/${name}_linux_amd64.tar.gz" -C "$smoke/extract"
            install -m 0755 "$smoke/extract/${name}_linux_amd64/$name" "$smoke/set/$name"
          done
          ln -s "$(command -v git)" "$smoke/path/git"
          git init -q "$smoke/fixture"
          printf '# Fixture\n' > "$smoke/fixture/README.md"
          git -C "$smoke/fixture" add -A
          git -C "$smoke/fixture" -c user.name=t -c user.email=t@example.invalid commit -qm fixture
          run() { env -i PATH="$smoke/path" HOME="$smoke/home" "$smoke/set/corvint" "$@"; }
          run docs --help | tee "$smoke/help.txt"
          grep -q 'Usage:' "$smoke/help.txt"
          run --root "$smoke/fixture" docs citations check | tee "$smoke/check.txt"
          grep -q 'docs citations check:' "$smoke/check.txt"
          version=$(run --version | head -n 1 | awk '{print $2}')
          for name in corvint-mcp corvint-docs-mcp; do
            [ -f "$out/${name}_linux_amd64.tar.gz" ] || continue
            tar -xzf "$out/${name}_linux_amd64.tar.gz" -C "$smoke/extract"
            install -m 0755 "$smoke/extract/${name}_linux_amd64/$name" "$smoke/set/$name"
            env -i PATH="$smoke/path" HOME="$smoke/home" "$smoke/set/$name" --version | tee "$smoke/$name.txt"
            grep -q "^$name $version " "$smoke/$name.txt"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  publish:
    needs: build
    # Off until the owner has configured the protected `release` environment and the attestation
    # has landed (see the header); the default stops the run after `build`.
    if: vars.RELEASE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # GHA-V1-041: the owner's approval of this protected environment starts the job.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-binaries
          path: ${{ runner.temp }}/release
      - name: Recheck the artifact's checksums
        working-directory: ${{ runner.temp }}/release
        run: |
          sha256sum --check --strict SHA256SUMS release-manifest.json.sha256
          for sums in ./*.SHA256SUMS; do
            sha256sum --check --strict "$sums"
          done
      - name: Create the GitHub release from the stopped run's artifact (GHA-V1-041)
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The tag may have moved since the run started: refuse unless the remote tag, peeled
          # through at most 8 annotated tag objects, still names the tested commit. Tag
          # protection itself is a repository setting (GHA-V1-042).
          read -r type object < <(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha') || true
          for _ in 1 2 3 4 5 6 7 8; do
            [ "$type" = tag ] || break
            read -r type object < <(gh api "repos/$GH_REPO/git/tags/$object" --jq '.object.type + " " + .object.sha') || true
          done
          if [ "$type" != commit ] || [ "$object" != "$SHA" ]; then
            echo "::error::tag $TAG names ${type:-nothing} ${object:-}, not the tested commit $SHA; nothing is published"
            exit 1
          fi
          prerelease=()
          case "${TAG##*/v}" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" "${prerelease[@]}" \
            --notes "Built from $SHA by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID; checksums: SHA256SUMS; manifest: release-manifest.json." \
            ./*
