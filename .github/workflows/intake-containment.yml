name: Intake containment

# Fast signal, about two minutes: the closed-vocabulary, hostile-twin and builder-mutant
# tests of the intake path, without the race detector. go-product runs the same two
# packages with -race as part of the complete universe and remains the required check;
# this job only reports an intake regression long before a go-product shard reaches it.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  containment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      GOSUMDB: "off"
      GOWORK: "off"
      GOFLAGS: ""
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Closed vocabulary, hostile twins and builder mutants
        run: |
          test "$(go env GOVERSION)" = "go1.27.1"
          go test -count=1 -timeout 10m ./internal/intake ./cmd/corvint-intake
