name: Intake containment
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  containment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Closed vocabulary, hostile twins and builder mutants
        env:
          GOTOOLCHAIN: local
        run: go test -count=1 -timeout 30m ./internal/intake ./cmd/corvint-intake
