# ANDROID-RELEASE-VERSION-SOURCE-1 / ANDTV-STORE-READINESS-1: the single authoritative source for
# both app modules' release versionName AND versionCode (build.gradle.kts reads it; neither module
# restates a literal).
#
# versionCode is a committed literal, not `git rev-list --count HEAD`: a commit count regresses on
# any hotfix branch or behind-main worktree and nothing pinned the last code Play had accepted.
# Rules (enforced at Gradle configuration time — a build that would regress cannot be configured):
#   - versionCode MUST be strictly greater than lastPublishedVersionCode.
#   - After a Play upload is accepted, set lastPublishedVersionCode to the uploaded versionCode and
#     bump versionCode above it in the same commit. Play rejects any upload <= the highest accepted.
# Seed (2026-08-22): the rev-list-derived codes in circulation reached 551 (lane head; main was 547),
# so lastPublishedVersionCode starts at 551 and versionCode at 600 — no build can regress below
# anything the old derivation produced.
versionName=0.1.0
versionCode=600
lastPublishedVersionCode=551
