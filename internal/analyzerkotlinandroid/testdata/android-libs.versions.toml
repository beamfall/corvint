[versions]
coil = "3.5.0"
compose-bom = "2026.06.01"
activity-compose = "1.13.0"
biometric = "1.1.0"
fragment = "1.8.9"
lifecycle = "2.10.0"
media3 = "1.10.1"
tv-material = "1.1.0"
play-services-cast = "22.3.1"
engage-core = "1.6.0"
kotlinx-serialization-json = "1.11.0"
kotlinx-coroutines = "1.11.0"
okhttp = "5.4.0"
play-billing = "9.1.0"
junit = "4.13.2"
benchmark-macro-junit4 = "1.4.1"
# TECHAUDIT-5: baseline-profile generator (androidx.baselineprofile) + the on-device installer that
# consumes the checked-in profile at app-install time (androidx.profileinstaller).
baselineprofile = "1.5.0-alpha07"
profileinstaller = "1.4.1"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
uiautomator = "2.3.0"
roborazzi = "1.68.0"
robolectric = "4.16.1"
androidx-test-core = "1.7.0"
kover = "0.9.8"
# TECHAUDIT-4: Spotless + ktlint Kotlin formatting gate. ktlint version is pinned so the gate is
# reproducible across machines; Spotless drives ktlint via its bundled engine.
spotless = "8.8.0"
ktlint = "1.8.0"
# AUDIT0728-NC-ANDROID-SUPPLY-CHAIN-1: 0.2.2 is the NEWEST version published for BOTH
# com.beamfall.android-ui:kit and :ui. This is not a downgrade of anything that ever shipped from
# the registry — the prior 0.2.15 value was a phantom pin that no package-mode resolve could ever
# have satisfied. Verified against the registry itself, not against docs:
#   gh api /orgs/Beamfall/packages/maven/com.beamfall.android-ui.kit/versions
#     -> 0.1.0, 0.2.0, 0.2.1, 0.2.2 (four versions, nothing above 0.2.2)
#   GET maven.pkg.github.com/Beamfall/android-ui/.../kit/<v>/kit-<v>.pom
#     -> 0.2.2 = 302 (present); 0.2.4, 0.2.7, 0.2.15, 0.2.20 = 404 (absent), same for :ui
# The pin drifted to 0.2.4 -> 0.2.7 -> 0.2.15 by tracking the SOURCE version in the sibling
# beamfall-android-ui checkout; those bumps were invisible because the default build substitutes
# :kit from that sibling composite (settings.gradle.kts:82-85), where the version string is inert.
# Locks and verification metadata require a coordinate that actually resolves, so this ticket had to
# pin the real published one.
# RESTORING PARITY (in order; GitHub Packages versions are immutable, so publish before repinning).
# Steps 1-2 are NOT agent-executable — see docs/qa/evidence/subt-android-1-package-mode.md:
#   1. land `LibmpvTrackList` on beamfall-android-ui main; without it neither composite nor package
#      mode compiles (that doc §3 reproduces the unresolved reference).
#   2. OPERATOR ACTION: authorize the registry publish (operator decision 2026-07-26 #1 lifts the
#      push exclusion for repo mains but keeps the registry excluded) and supply a `write:packages`
#      token, then from ../beamfall-android-ui: `./gradlew :kit:publish :ui:publish` at its source
#      version (0.2.20 as of 2026-08-08).
#   3. bump the value below to the version that step 2 actually published.
#   4. re-run `make gate GATE_ARGS=-PbeamfallAndroidUiSource=package` (AGENTS.md "Package-read gate
#      mode") to prove the coordinate resolves, then regenerate locks + verification metadata.
# Never bump this value to match the sibling SOURCE version alone — that is exactly how the pin
# drifted to the unresolvable 0.2.15. Step 4 is what makes a bump real.
beamfall-android-ui-kit = "0.2.2"
zxing-core = "3.5.4"
# SETTINGS-3 (ADR-0172 §2 Law I): device-scoped preference store. NON-secure by contract — no
# secret ever lands here (secrets stay in Keystore-backed stores per Invariant 5).
datastore-preferences = "1.2.1"
# PHOTOPAR-11 (ADR-0045 §2.11): WorkManager backs the camera-backup background-transfer worker.
work = "2.11.2"

[libraries]
# NGAUDIT-B11: replaces the decorative placeholder grid with a real QR of the enrollment URL.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing-core" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

# Shared Beamfall Android SDK, published from ../beamfall-android-ui to GitHub Packages.
# GitHub Packages versions are immutable: publish the android-ui kit first, then repin this value.
beamfall-android-ui-kit = { module = "com.beamfall.android-ui:kit", version.ref = "beamfall-android-ui-kit" }
beamfall-android-ui-ui = { module = "com.beamfall.android-ui:ui", version.ref = "beamfall-android-ui-kit" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-adaptive-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
compose-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "tv-material" }
# SETTINGS-3 (ADR-0172 §2): DataStore<Preferences> device-settings layer for mobile + the TV
# playback-prefs migration off the legacy `beamfall_tv_playback` SharedPreferences.
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore-preferences" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }

media3-decoder = { module = "androidx.media3:media3-decoder", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }

play-services-cast-framework = { module = "com.google.android.gms:play-services-cast-framework", version.ref = "play-services-cast" }
google-engage-core = { module = "com.google.android.engage:engage-core", version.ref = "engage-core" }

# OkHttp client — backs the SPKI CertificatePinner transport (ADR-0046). Already present in the
# offline cache via Coil's coil-network-okhttp; pinned to the same 4.12.0 here.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# Test-only: HeldCertificate (self-signed cert with a known keypair) + a TLS MockWebServer let the
# CertificatePinner wiring be exercised on the JVM with a real handshake.
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

# Google Play Billing Library v9 (ADR-0017 billing channel; 9.x adopted pre-GA 2026-07-11). Real artifact group is
# `com.android.billingclient` (NOT com.google.android.billingclient).
play-billing = { module = "com.android.billingclient:billing", version.ref = "play-billing" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark-macro-junit4" }
# TECHAUDIT-5: on-device profile installer consumed by the shipped app; loads the checked-in
# baseline profile (assets/dexopt/baseline.prof) at first-run install time.
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

# Screenshot catalog (Roborazzi on Robolectric/JVM — no device/emulator). See ui-catalog/README.md.
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }

[plugins]
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
# TECHAUDIT-4: Spotless drives the ktlint Kotlin formatter (see root build.gradle.kts).
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
# TECHAUDIT-5: generates + wires the checked-in startup baseline profile.
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }

[bundles]
media3 = ["media3-exoplayer", "media3-exoplayer-hls", "media3-datasource-okhttp", "media3-ui", "media3-session"]
macrobenchmark = [
    "androidx-benchmark-macro-junit4",
    "androidx-test-runner",
    "androidx-test-ext-junit",
    "androidx-test-uiautomator",
]
