[versions]
beamfall-ui = "0.2.20"
coil = "3.5.0"
compose-bom = "2026.06.01"
activity-compose = "1.13.0"
lifecycle = "2.10.0"
media3 = "1.10.1"
tv-material = "1.1.0"
play-services-cast = "22.3.1"
kotlinx-serialization-json = "1.11.0"
kotlinx-coroutines = "1.11.0"
okhttp = "5.4.0"
play-billing = "8.0.0"
junit = "4.13.2"
benchmark-macro-junit4 = "1.4.0"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
uiautomator = "2.3.0"
roborazzi = "1.68.0"
robolectric = "4.16.1"
androidx-test-core = "1.7.0"

[libraries]
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test = { module = "androidx.compose.ui:ui-test" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "tv-material" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }

play-services-cast-framework = { module = "com.google.android.gms:play-services-cast-framework", version.ref = "play-services-cast" }

# OkHttp client — backs the SPKI CertificatePinner transport (ADR-0046). Already present in the
# offline cache via Coil's coil-network-okhttp; kept on one workspace-wide OkHttp version (5.x).
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# Test-only: HeldCertificate (self-signed cert with a known keypair) + a TLS MockWebServer let the
# CertificatePinner wiring be exercised on the JVM with a real handshake.
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

# Google Play Billing Library v8 (ADR-0017 "Play Billing 8"). Real artifact group is
# `com.android.billingclient` (NOT com.google.android.billingclient).
play-billing = { module = "com.android.billingclient:billing", version.ref = "play-billing" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark-macro-junit4" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

# Screenshot catalog (Roborazzi on Robolectric/JVM — no device/emulator). See ui-catalog/README.md.
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }

[plugins]
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
kover = { id = "org.jetbrains.kotlinx.kover", version = "0.9.8" }

[bundles]
media3 = ["media3-exoplayer", "media3-exoplayer-hls", "media3-ui", "media3-session"]
macrobenchmark = [
    "androidx-benchmark-macro-junit4",
    "androidx-test-runner",
    "androidx-test-ext-junit",
    "androidx-test-uiautomator",
]
